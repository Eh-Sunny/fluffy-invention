        function importData(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.configs || !data.agents || !data.conversations) {
                        throw new Error('数据格式无效：缺少必要字段');
                    }
                    if (!confirm('导入将覆盖当前所有数据（配置、角色、对话历史），确定继续吗？')) return;

                    configs = data.configs || [];
                    agents = data.agents || [];
                    conversations = data.conversations || [];
                    currentConfigId = data.currentConfigId || (configs.length > 0 ? configs[0].id : null);
                    currentConvId = data.currentConvId || (conversations.length > 0 ? conversations[0].id : null);

                    saveConfigs();
                    saveAgents();
                    saveConversations();
                    loadCurrentConvMessages();
                    renderAgentList();
                    renderConversationList();
                    renderAtDropdown();
                    renderConfigList();
                    showToast('✅ 数据导入成功');
                } catch (err) {
                    showToast('❌ 导入失败：' + err.message);
                }
            };
            reader.onerror = function() {
                showToast('❌ 读取文件失败');
            };
            reader.readAsText(file);
        }

        // ---------- 附件处理（多附件） ----------
        function handleFiles(files) {
            if (!files || files.length === 0) return;
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const isText = file.type.startsWith('text/') || file.name.match(/\.(txt|md|json|js|css|html|xml|yml|yaml|log|csv|tsv|py|java|c|cpp|h|sh|bat|ps1|rb|go|rs|swift|kt|dart)$/i);
                const isImage = file.type.startsWith('image/');

                if (isText) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        uploadedFiles.push({
                            file: file,
                            dataUrl: null,
                            content: e.target.result,
                            isText: true,
                            isImage: false,
                        });
                        renderAttachments();
                        showToast(`✅ 已附加文本文件: ${file.name}`);
                    };
                    reader.onerror = function() {
                        showToast('❌ 读取文件失败');
                    };
                    reader.readAsText(file);
                } else if (isImage) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        uploadedFiles.push({
                            file: file,
                            dataUrl: e.target.result,
                            content: null,
                            isText: false,
                            isImage: true,
                        });
                        renderAttachments();
                        showToast(`✅ 已附加图片: ${file.name}`);
                    };
                    reader.onerror = function() {
                        showToast('❌ 读取图片失败');
                    };
                    reader.readAsDataURL(file);
                } else {
                    // 其他文件，不读取内容
                    uploadedFiles.push({
                        file: file,
                        dataUrl: null,
                        content: null,
                        isText: false,
                        isImage: false,
                    });
                    renderAttachments();
                    showToast(`📎 已附加文件: ${file.name}`);
                }
            }
        }

        function renderAttachments() {
            if (uploadedFiles.length === 0) {
                fileTip.classList.remove('show');
                fileTip.innerHTML = '';
                return;
            }
            fileTip.classList.add('show');
            let html = '';
            for (let i = 0; i < uploadedFiles.length; i++) {
                const item = uploadedFiles[i];
                const file = item.file;
                let previewHtml = '';
                if (item.isImage && item.dataUrl) {
                    previewHtml = `<img src="${item.dataUrl}" alt="${escapeHtml(file.name)}" />`;
                } else {
                    previewHtml = `<span class="file-icon">📎</span>`;
                }
                html += `
                    <div class="file-item" data-index="${i}">
                        <div class="preview">
                            ${previewHtml}
                            <span class="file-name">${escapeHtml(file.name)}</span>
                        </div>
                        <button class="remove-attachment" data-index="${i}" title="移除">✕</button>
                    </div>
                `;
            }
            fileTip.innerHTML = html;
            // 绑定删除事件
            fileTip.querySelectorAll('.remove-attachment').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(e.target.dataset.index, 10);
                    removeAttachment(idx);
                });
            });
        }

        function removeAttachment(index) {
            if (index >= 0 && index < uploadedFiles.length) {
                uploadedFiles.splice(index, 1);
                renderAttachments();
                if (uploadedFiles.length === 0) showToast('已移除所有附件');
                else showToast('已移除一个附件');
            }
        }

        function clearAllAttachments() {
            uploadedFiles = [];
            renderAttachments();
        }

        // ---------- 流式请求 ----------
        async function streamAgent(agent, messages_payload, msgId, onUpdate, onDone, onError) {
            const cfg = getAgentConfig(agent.id);
            if (!cfg) { onError(new Error('未绑定API配置')); return; }
            const { apiBase, apiKey, model, maxTokens } = cfg;
            const url = `${apiBase.replace(/\/+$/, '')}/chat/completions`;

            const controller = new AbortController();
            activeControllers.push(controller);
            streamingMsgIds.add(msgId);

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`,
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: messages_payload,
                        stream: true,
                        temperature: 0.8,
                        max_tokens: maxTokens || 4096,
                    }),
                    signal: controller.signal,
                });

                if (!response.ok) {
                    let errMsg = `HTTP ${response.status}`;
                    try { const errData = await response.json();
                        errMsg = errData.error?.message || errMsg; } catch (_) {}
                    throw new Error(errMsg);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';
                let fullContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data:')) continue;
                        const data = trimmed.slice(5).trim();
                        if (data === '[DONE]') continue;
                        try {
                            const json = JSON.parse(data);
                            const delta = json.choices?.[0]?.delta?.content;
                            if (delta) {
                                fullContent += delta;
                                onUpdate(fullContent);
                            }
                        } catch (_) {}
                    }
                }

                onDone(fullContent);
            } catch (err) {
                if (err.name === 'AbortError') {
                    onError(new Error('已中断'), true);
                } else {
                    onError(err);
                }
            } finally {
                const idx = activeControllers.indexOf(controller);
                if (idx !== -1) activeControllers.splice(idx, 1);
                streamingMsgIds.delete(msgId);
                if (streamingMsgIds.size === 0) {
                    isStreaming = false;
                    setInputEnabled(true);
                    sendBtn.disabled = false;
                }
            }
        }

        // ---------- 打断 ----------
        function stopAllStreams() {
            if (activeControllers.length === 0) return;
            for (const ctrl of activeControllers) {
                ctrl.abort();
            }
            activeControllers = [];
            for (const msgId of streamingMsgIds) {
                const msg = messages.find(m => m.id === msgId);
                if (msg) {
                    msg.interrupted = true;
                    msg.content = (msg.content || '') + ' (已中断)';
                    finishStreamingMessage(msgId, msg.content, false, true);
                }
            }
            streamingMsgIds.clear();
            isStreaming = false;
            setInputEnabled(true);
            sendBtn.disabled = false;
            showToast('⏹ 已停止生成');
            saveCurrentConversation();
            renderConversationList();
        }

        // ---------- 快速回复（支持多附件） ----------
        async function quickReply(text) {
            if (!text && uploadedFiles.length === 0) { showToast('请输入消息或上传文件'); return; }
            if (isStreaming) return;

            let targets = getTargetAgents();
            if (targets.length === 0) { showToast('没有启用的AI'); return; }

            if (groupChatMode) {
                targets = targets.filter(agent => Math.random() < 0.4);
                if (targets.length === 0) {
                    const silentMsg = {
                        id: genId(),
                        role: 'divider',
                        content: '💤 所有AI都选择了旁观，无人发言',
                        timestamp: Date.now(),
                    };
                    messages.push(silentMsg);
                    addMessageElement(silentMsg, false);
                    saveCurrentConversation();
                    scrollToBottomIfNeeded();
                    showToast('💤 所有AI保持沉默');
                    return;
                }
            }

            for (const agent of targets) {
                const cfg = getAgentConfig(agent.id);
                if (!cfg || !cfg.apiKey) { showToast(`⚠️ "${agent.name}" 缺少API配置`); return; }
            }

            isStreaming = true;
            setInputEnabled(false);
            sendBtn.disabled = false;
            inputBox.value = '';
            inputBox.style.height = 'auto';

            // 构建用户消息
            let userContent = text || '';
            // 遍历所有附件
            for (const item of uploadedFiles) {
                const file = item.file;
                if (item.isText && item.content) {
                    userContent += `\n\n[附件: ${file.name}]\n${item.content}`;
                } else if (item.isImage) {
                    userContent += `\n\n[图片: ${file.name}]`;
                } else {
                    userContent += `\n\n[文件: ${file.name}]`;
                }
            }

            const userMsg = { id: genId(), role: 'user', content: userContent, timestamp: Date.now() };
            messages.push(userMsg);
            addMessageElement(userMsg, false);
            saveCurrentConversation();
            scrollToBottomIfNeeded();

            // 清空附件
            clearAllAttachments();

            const promises = targets.map(async (agent) => {
                const msgId = genId();
                const msg = {
                    id: msgId,
                    role: 'agent',
                    agentId: agent.id,
                    content: '',
                    timestamp: Date.now(),
                    streaming: true,
                };
                messages.push(msg);
                addMessageElement(msg, true);
                saveCurrentConversation();
                scrollToBottomIfNeeded();

                const history = messages.filter(m => m.id !== msgId && m.role !== 'system' && !m.interrupted).slice(-10);
                const payload = [];
                const sysPrompt = agent.prompt || '你是一个乐于助人的AI助手。';
                payload.push({ role: 'system', content: sysPrompt });
                for (const m of history) {
                    if (m.role === 'user') {
                        payload.push({ role: 'user', content: m.content });
                    } else if (m.role === 'agent' && m.agentId) {
                        const a = agents.find(ag => ag.id === m.agentId);
                        if (a) payload.push({ role: 'assistant', content: `[${a.name}]: ${m.content}` });
                        else payload.push({ role: 'assistant', content: m.content });
                    }
                }
                payload.push({ role: 'user', content: userContent });

                await streamAgent(agent, payload, msgId,
                    (content) => {
                        updateStreamingMessage(msgId, content);
                        const m = messages.find(mm => mm.id === msgId);
                        if (m) m.content = content;
                    },
                    (content) => {
                        const m = messages.find(mm => mm.id === msgId);
                        if (m) { m.content = content;
                            m.streaming = false; }
                        finishStreamingMessage(msgId, content, false, false);
                        saveCurrentConversation();
                        renderConversationList();
                    },
                    (err, interrupted = false) => {
                        const errMsg = interrupted ? '已中断' : `❌ ${err.message || '请求失败'}`;
                        const m = messages.find(mm => mm.id === msgId);
                        if (m) {
                            m.content = errMsg;
                            m.error = !interrupted;
                            m.interrupted = interrupted;
                            m.streaming = false;
                        }
                        finishStreamingMessage(msgId, errMsg, !interrupted, interrupted);
                        saveCurrentConversation();
                        renderConversationList();
                    }
                );
            });

            await Promise.allSettled(promises);
            if (streamingMsgIds.size === 0) {
                isStreaming = false;
                setInputEnabled(true);
                sendBtn.disabled = false;
            }
            saveCurrentConversation();
            renderConversationList();
            inputBox.focus();
        }

        // ---------- 辩论（支持多附件） ----------
        async function callAgentStreamForDebate(agent, roundName, userText, history, msgId, attachments) {
            const cfg = getAgentConfig(agent.id);
            if (!cfg) throw new Error('未绑定API配置');
            const { apiBase, apiKey, model, maxTokens } = cfg;
            const url = `${apiBase.replace(/\/+$/, '')}/chat/completions`;

            let historyText = '';
            if (history.length > 0) {
                historyText = history.map(h => `${h.name}: ${h.content}`).join('\n\n');
            }

            let systemPrompt = agent.prompt || '你是一个乐于助人的AI助手。';
            let fileParts = '';
            for (const item of attachments) {
                const file = item.file;
                if (item.isText && item.content) {
                    fileParts += `\n\n[附件: ${file.name}]\n${item.content}`;
                } else if (item.isImage) {
                    fileParts += `\n\n[图片: ${file.name}]`;
                } else {
                    fileParts += `\n\n[文件: ${file.name}]`;
                }
            }

            let userPrompt = '';
            switch (roundName) {
                case '初步看法':
                    userPrompt = `用户问题：${userText}${fileParts}\n\n请给出你的初步看法，直接阐述你的观点和理由。`;
                    break;
                case '相互评价':
                    userPrompt =
                        `用户问题：${userText}${fileParts}\n\n【各AI的初步看法】\n${historyText}\n\n请结合你自己的看法，客观评价其他AI的观点，指出异同、补充或质疑。`;
                    break;
                case '自由辩论第一轮':
                case '自由辩论第二轮':
                    userPrompt =
                        `用户问题：${userText}${fileParts}\n\n【上一轮讨论记录】\n${historyText}\n\n请继续进行自由辩论，你可以反驳他人的观点、维护自己的立场或提出新的论据。${roundName === '自由辩论第二轮' ? ' 这是最后一轮，请做出总结性陈述。' : ''}`;
                    break;
                default:
                    userPrompt = `用户问题：${userText}${fileParts}\n\n请给出你的看法。`;
            }

            const payload = [
                { role: 'system', content: systemPrompt },
                { role: 'user', content: userPrompt },
            ];

            const controller = new AbortController();
            activeControllers.push(controller);
            streamingMsgIds.add(msgId);

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`,
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: payload,
                        stream: true,
                        temperature: 0.8,
                        max_tokens: maxTokens || 4096,
                    }),
                    signal: controller.signal,
                });

                if (!response.ok) {
                    let errMsg = `HTTP ${response.status}`;
                    try { const errData = await response.json();
                        errMsg = errData.error?.message || errMsg; } catch (_) {}
                    throw new Error(errMsg);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';
                let fullContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data:')) continue;
                        const data = trimmed.slice(5).trim();
                        if (data === '[DONE]') continue;
                        try {
                            const json = JSON.parse(data);
                            const delta = json.choices?.[0]?.delta?.content;
                            if (delta) {
                                fullContent += delta;
                                updateStreamingMessage(msgId, fullContent);
                                const m = messages.find(mm => mm.id === msgId);
                                if (m) m.content = fullContent;
                            }
                        } catch (_) {}
                    }
                }

                const m = messages.find(mm => mm.id === msgId);
                if (m) { m.content = fullContent;
                    m.streaming = false; }
                finishStreamingMessage(msgId, fullContent, false, false);
                saveCurrentConversation();
                renderConversationList();
                return fullContent;
            } catch (err) {
                if (err.name === 'AbortError') {
                    const m = messages.find(mm => mm.id === msgId);
                    if (m) {
                        m.content = (m.content || '') + ' (已中断)';
                        m.interrupted = true;
                        m.streaming = false;
                    }
                    finishStreamingMessage(msgId, m?.content || '已中断', false, true);
                    saveCurrentConversation();
                    renderConversationList();
                    return '已中断';
                } else {
                    const errMsg = `❌ ${err.message || '请求失败'}`;
                    const m = messages.find(mm => mm.id === msgId);
                    if (m) { m.content = errMsg;
                        m.error = true;
                        m.streaming = false; }
                    finishStreamingMessage(msgId, errMsg, true, false);
                    saveCurrentConversation();
                    renderConversationList();
                    return errMsg;
                }
            } finally {
                const idx = activeControllers.indexOf(controller);
                if (idx !== -1) activeControllers.splice(idx, 1);
                streamingMsgIds.delete(msgId);
            }
        }

        async function runDebateRound(roundName, userText, agents, history, onComplete, attachments) {
            const promises = agents.map(async (agent) => {
                const msgId = genId();
                const msg = {
                    id: msgId,
                    role: 'agent',
                    agentId: agent.id,
                    content: '',
                    timestamp: Date.now(),
                    streaming: true,
                };
                messages.push(msg);
                addMessageElement(msg, true);
                saveCurrentConversation();
                scrollToBottomIfNeeded();

                try {
                    const content = await callAgentStreamForDebate(agent, roundName, userText, history, msgId, attachments);
                    if (content !== '已中断') {
                        const m = messages.find(mm => mm.id === msgId);
                        if (m) m.content = content;
                        finishStreamingMessage(msgId, content, false, false);
                    }
                    if (onComplete) onComplete(agent, content);
                    return content;
                } catch (err) {
                    // 内部已处理
                }
            });
            await Promise.allSettled(promises);
            await new Promise(r => setTimeout(r, 200));
        }

        async function startDebate() {
            const text = inputBox.value.trim();
            if (!text && uploadedFiles.length === 0) { showToast('请输入话题或上传文件'); return; }
            if (isStreaming || isDebating) return;

            const targets = getTargetAgents();
            if (targets.length < 2) {
                showToast('至少需要 2 个启用的 AI 才能开始讨论');
                return;
            }

            for (const agent of targets) {
                const cfg = getAgentConfig(agent.id);
                if (!cfg || !cfg.apiKey) {
                    showToast(`⚠️ "${agent.name}" 缺少API配置`);
                    return;
                }
            }

            isDebating = true;
            isStreaming = true;
            debateBtn.disabled = true;
            setInputEnabled(false);
            sendBtn.disabled = false;
            inputBox.value = '';
            inputBox.style.height = 'auto';

            // 构建用户消息
            let userContent = text || '';
            const attachmentsCopy = uploadedFiles.slice(); // 拷贝一份
            for (const item of attachmentsCopy) {
                const file = item.file;
                if (item.isText && item.content) {
                    userContent += `\n\n[附件: ${file.name}]\n${item.content}`;
                } else if (item.isImage) {
                    userContent += `\n\n[图片: ${file.name}]`;
                } else {
                    userContent += `\n\n[文件: ${file.name}]`;
                }
            }

            const userMsg = { id: genId(), role: 'user', content: userContent, timestamp: Date.now() };
            messages.push(userMsg);
            addMessageElement(userMsg, false);
            saveCurrentConversation();
            scrollToBottomIfNeeded();

            // 清空附件
            clearAllAttachments();

            let debateHistory = [];

            addDivider('📌 阶段一：各 AI 发表初步看法');
            await runDebateRound('初步看法', text, targets, debateHistory, (agent, content) => {
                if (content !== '已中断') debateHistory.push({ round: 'opinion', agentId: agent.id, name: agent.name,
                    content });
            }, attachmentsCopy);

            if (streamingMsgIds.size > 0 || activeControllers.length > 0) {
                isDebating = false;
                isStreaming = false;
                debateBtn.disabled = false;
                setInputEnabled(true);
                sendBtn.disabled = false;
                showToast('⏹ 讨论已中断');
                saveCurrentConversation();
                renderConversationList();
                return;
            }

            addDivider('🔍 阶段二：相互评价与补充');
            await runDebateRound('相互评价', text, targets, debateHistory, (agent, content) => {
                if (content !== '已中断') debateHistory.push({ round: 'review', agentId: agent.id, name: agent.name,
                    content });
            }, attachmentsCopy);
            if (streamingMsgIds.size > 0 || activeControllers.length > 0) {
                isDebating = false;
                isStreaming = false;
                debateBtn.disabled = false;
                setInputEnabled(true);
                sendBtn.disabled = false;
                showToast('⏹ 讨论已中断');
                saveCurrentConversation();
                renderConversationList();
                return;
            }

            addDivider('⚡ 阶段三：自由辩论 · 第一轮');
            await runDebateRound('自由辩论第一轮', text, targets, debateHistory, (agent, content) => {
                if (content !== '已中断') debateHistory.push({ round: 'debate1', agentId: agent.id, name: agent.name,
                    content });
            }, attachmentsCopy);
            if (streamingMsgIds.size > 0 || activeControllers.length > 0) {
                isDebating = false;
                isStreaming = false;
                debateBtn.disabled = false;
                setInputEnabled(true);
                sendBtn.disabled = false;
                showToast('⏹ 讨论已中断');
                saveCurrentConversation();
                renderConversationList();
                return;
            }

            addDivider('⚡ 阶段四：自由辩论 · 第二轮（最终轮）');
            await runDebateRound('自由辩论第二轮', text, targets, debateHistory, (agent, content) => {
                if (content !== '已中断') debateHistory.push({ round: 'debate2', agentId: agent.id, name: agent.name,
                    content });
            }, attachmentsCopy);

            isDebating = false;
            isStreaming = false;
            debateBtn.disabled = false;
            setInputEnabled(true);
            sendBtn.disabled = false;
            inputBox.focus();
            saveCurrentConversation();
            renderConversationList();
            showToast('✅ 讨论结束');
        }

        // ---------- 事件绑定 ----------
        sendBtn.addEventListener('click', () => {
            if (isStreaming) {
                stopAllStreams();
                return;
            }
            const text = inputBox.value.trim();
            if (text || uploadedFiles.length > 0) quickReply(text);
            else showToast('请输入消息或上传文件');
        });

        inputBox.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const text = inputBox.value.trim();
                if (text || uploadedFiles.length > 0) quickReply(text);
                else showToast('请输入消息或上传文件');
            }
        });
        inputBox.addEventListener('input', autoResize);

        groupBtn.addEventListener('click', toggleGroupMode);
        debateBtn.addEventListener('click', startDebate);

        newChatBtn.addEventListener('click', createNewConversation);
        newChatSidebarBtn.addEventListener('click', createNewConversation);

        menuBtn.addEventListener('click', () => {
            sidebar.classList.add('open');
            sidebarOverlay.classList.add('active');
            renderAgentList();
            renderConversationList();
        });
        sidebarClose.addEventListener('click', () => {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
        });
        sidebarOverlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
        });
        addAgentBtn.addEventListener('click', () => { sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
            openAgentEditor(null); });

        settingsBtn.addEventListener('click', () => {
            renderConfigList();
            resetConfigForm();
            modal.classList.add('active');
        });
        modalClose.addEventListener('click', () => { modal.classList.remove('active');
            resetConfigForm(); });
        modal.addEventListener('click', (e) => { if (e.target === modal) { modal.classList.remove('active');
                resetConfigForm(); } });

        agentModal.addEventListener('click', (e) => { if (e.target === agentModal) closeAgentEditor(); });

        atBtn.addEventListener('click', (e) => { e.stopPropagation();
            toggleAtDropdown(); });
        document.addEventListener('click', (e) => { if (!atSelector.contains(e.target)) closeAtDropdown(); });

        formCancel.addEventListener('click', resetConfigForm);
        formSave.addEventListener('click', saveConfigForm);
        formDelete.addEventListener('click', () => {
            if (editingConfigId && configs.length > 1) {
                if (confirm(`删除配置 "${configs.find(c=>c.id===editingConfigId)?.name}" 吗？`)) {
                    deleteConfig(editingConfigId);
                    resetConfigForm();
                }
            } else showToast('至少保留一个配置');
        });
        addConfigBtn.addEventListener('click', () => {
            resetConfigForm();
            editingConfigId = null;
            formDelete.style.display = 'none';
            configForm.classList.add('open');
            cfgName.focus();
        });
        fetchModelsBtn.addEventListener('click', fetchModels);

        agentFormCancel.addEventListener('click', closeAgentEditor);
        agentFormSave.addEventListener('click', saveAgentForm);
        agentFormDelete.addEventListener('click', () => {
            if (editingAgentId && agents.length > 1) {
                if (confirm(`删除角色 "${agents.find(a=>a.id===editingAgentId)?.name}" 吗？`)) {
                    deleteAgent(editingAgentId);
                    closeAgentEditor();
                }
            } else showToast('至少保留一个角色');
        });

        // 文件上传
        fileBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFiles(e.target.files);
            }
            fileInput.value = '';
        });

        // 拖拽上传
        const inputArea = document.getElementById('inputArea');
        inputArea.addEventListener('dragover', (e) => { e.preventDefault();
            inputArea.style.borderColor = 'rgba(79,140,255,0.5)'; });
        inputArea.addEventListener('dragleave', (e) => { e.preventDefault();
            inputArea.style.borderColor = ''; });
        inputArea.addEventListener('drop', (e) => {
            e.preventDefault();
            inputArea.style.borderColor = '';
            if (e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
            }
        });

        // 导出/导入
        exportBtn.addEventListener('click', exportData);
        importBtn.addEventListener('click', () => importFileInput.click());
        importFileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                importData(e.target.files[0]);
                importFileInput.value = '';
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (modal.classList.contains('active')) { modal.classList.remove('active');
                    resetConfigForm(); }
                if (agentModal.classList.contains('active')) closeAgentEditor();
                if (sidebar.classList.contains('open')) { sidebar.classList.remove('open');
                    sidebarOverlay.classList.remove('active'); }
                closeAtDropdown();
                if (isStreaming) stopAllStreams();
            }
        });

        // ---------- 初始化 ----------
        loadConfigs();
        loadAgents();
        loadConversations();

        renderAgentList();
        renderConversationList();
        renderAtDropdown();
        renderConfigList();

        if (configs.length === 0) showToast('⚠️ 请先添加API配置');
        if (agents.length === 0) showToast('⚠️ 请添加AI角色');

        if (getEnabledAgents().length > 0 && configs.some(c => c.apiKey && c.apiKey.trim() !== '')) {
            inputBox.focus();
        }

        window.addEventListener('beforeunload', () => {
            saveCurrentConversation();
            saveAgents();
            saveConfigs();
        });

        console.log('🤖 AI群聊 · 多附件支持 已启动');
        console.log('📂 配置:', configs.length, '个');
        console.log('👥 AI角色:', agents.length, '个');
        console.log('💬 对话:', conversations.length, '个');

        window.toggleGroupMode = toggleGroupMode;

    })();
</script>
</body>
</html>
