<script>
    // ================================================================
    //  配置中心最终优化版 - 单返回键 + 非安全键盘 + 美化按钮
    // ================================================================

    (function() {
        'use strict';

        // ---------- DOM ----------
        const messagesEl = document.getElementById('messages');
        const inputBox = document.getElementById('inputBox');
        const sendBtn = document.getElementById('sendBtn');
        const debateBtn = document.getElementById('debateBtn');
        const groupBtn = document.getElementById('groupBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const welcomeEl = document.getElementById('welcome');
        const newChatBtn = document.getElementById('newChatBtn');
        const newChatSidebarBtn = document.getElementById('newChatSidebarBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const sidebarClose = document.getElementById('sidebarClose');
        const menuBtn = document.getElementById('menuBtn');
        const convListEl = document.getElementById('convList');
        const atSelector = document.getElementById('atSelector');
        const atBtn = document.getElementById('atBtn');
        const atLabel = document.getElementById('atLabel');
        const atArrow = document.getElementById('atArrow');
        const atDropdown = document.getElementById('atDropdown');
        const fileBtn = document.getElementById('fileBtn');
        const fileInput = document.getElementById('fileInput');
        const exportBtn = document.getElementById('exportDataBtn');
        const importBtn = document.getElementById('importDataBtn');
        const importFileInput = document.getElementById('importFileInput');
        const fileTip = document.getElementById('fileTip');

        // 配置中心
        const configCenter = document.getElementById('configCenter');
        const configCenterBack = document.getElementById('configCenterBack');
        const configCenterTitle = document.getElementById('configCenterTitle');
        const configMenu = document.getElementById('configMenu');
        const configBody = document.getElementById('configBody');

        // 子页面容器
        const apiConfigList = document.getElementById('apiConfigList');
        const agentConfigList = document.getElementById('agentConfigList');
        const apiAddBtn = document.getElementById('apiAddBtn');
        const agentAddBtn = document.getElementById('agentAddBtn');

        // 模态浮窗
        const modalOverlay = document.getElementById('modalOverlay');
        const modalWindow = document.getElementById('modalWindow');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalFooter = document.getElementById('modalFooter');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const modalCancel = document.getElementById('modalCancel');
        const modalSave = document.getElementById('modalSave');
        const modalDelete = document.getElementById('modalDelete');

        // ---------- 状态 ----------
        let isStreaming = false;
        let isDebating = false;
        let groupChatMode = false;
        let atTargets = [];
        let activeControllers = [];
        let streamingMsgIds = new Set();
        let uploadedFiles = [];

        // 当前编辑的ID（用于API或角色）
        let editingId = null;
        let editingType = null; // 'api' or 'agent'
        let modalCallback = null; // 用于导出导入选择后的回调

        // ---------- 存储 ----------
        const STORAGE = {
            CONFIGS: 'ai_group_configs',
            CURRENT_CONFIG_ID: 'ai_group_current_config_id',
            AGENTS: 'ai_group_agents',
            CONVERSATIONS: 'ai_group_conversations',
            CURRENT_CONV_ID: 'ai_group_current_conv_id',
        };

        let configs = [];
        let currentConfigId = null;
        let agents = [];
        let conversations = [];
        let currentConvId = null;
        let messages = [];

        // ---------- 初始化 ----------
        function loadConfigs() {
            try {
                const data = localStorage.getItem(STORAGE.CONFIGS);
                if (data) { configs = JSON.parse(data); } else { configs = []; }
            } catch (_) { configs = []; }
            if (configs.length === 0) configs = [];
            let needSave = false;
            for (const c of configs) {
                if (c.maxTokens === undefined) { c.maxTokens = 4096; needSave = true; }
                if (!c.models) { c.models = []; needSave = true; }
            }
            if (needSave) saveConfigs();

            try {
                const id = localStorage.getItem(STORAGE.CURRENT_CONFIG_ID);
                if (id && configs.some(c => c.id === id)) { currentConfigId = id; } else { currentConfigId = configs[0]?.id ||
                        null; }
            } catch (_) { currentConfigId = configs[0]?.id || null; }
            if (!currentConfigId && configs.length > 0) currentConfigId = configs[0].id;
        }

        function saveConfigs() {
            try {
                localStorage.setItem(STORAGE.CONFIGS, JSON.stringify(configs));
                if (currentConfigId) localStorage.setItem(STORAGE.CURRENT_CONFIG_ID, currentConfigId);
            } catch (_) {}
        }

        function loadAgents() {
            try {
                const data = localStorage.getItem(STORAGE.AGENTS);
                if (data) { agents = JSON.parse(data); } else { agents = []; }
            } catch (_) { agents = []; }
            if (agents.length === 0) {
                agents.push({
                    id: 'agent_default',
                    name: '小智',
                    avatar: '🤖',
                    configId: configs[0]?.id || null,
                    model: configs[0]?.models?.[0] || '',
                    prompt: '你是一个乐于助人的AI助手。',
                    enabled: true,
                });
                agents.push({
                    id: 'agent_creative',
                    name: '小创',
                    avatar: '🎨',
                    configId: configs[0]?.id || null,
                    model: configs[0]?.models?.[0] || '',
                    prompt: '你是一个富有创意、天马行空的AI。',
                    enabled: true,
                });
                saveAgents();
            }
            let needSave = false;
            for (const a of agents) {
                if (!configs.some(c => c.id === a.configId)) {
                    a.configId = configs[0]?.id || null;
                    needSave = true;
                }
                const cfg = configs.find(c => c.id === a.configId);
                if (cfg && a.model && !cfg.models.includes(a.model)) {
                    a.model = cfg.models[0] || '';
                    needSave = true;
                }
            }
            if (needSave) saveAgents();
        }

        function saveAgents() {
            try { localStorage.setItem(STORAGE.AGENTS, JSON.stringify(agents)); } catch (_) {}
        }

        function loadConversations() {
            try {
                const data = localStorage.getItem(STORAGE.CONVERSATIONS);
                if (data) { conversations = JSON.parse(data); } else { conversations = []; }
            } catch (_) { conversations = []; }
            if (conversations.length === 0) {
                const conv = { id: 'conv_default', title: '新对话', messages: [], createdAt: Date.now(), updatedAt: Date
                    .now() };
                conversations.push(conv);
                saveConversations();
            }
            try {
                const id = localStorage.getItem(STORAGE.CURRENT_CONV_ID);
                if (id && conversations.some(c => c.id === id)) { currentConvId = id; } else { currentConvId = conversations[
                        0]?.id || null; }
            } catch (_) { currentConvId = conversations[0]?.id || null; }
            if (!currentConvId && conversations.length > 0) currentConvId = conversations[0].id;
            loadCurrentConvMessages();
        }

        function saveConversations() {
            try {
                localStorage.setItem(STORAGE.CONVERSATIONS, JSON.stringify(conversations));
                if (currentConvId) localStorage.setItem(STORAGE.CURRENT_CONV_ID, currentConvId);
            } catch (_) {}
        }

        function loadCurrentConvMessages() {
            const conv = conversations.find(c => c.id === currentConvId);
            if (conv) messages = conv.messages || [];
            else messages = [];
            renderMessages();
        }

        function getCurrentConv() {
            return conversations.find(c => c.id === currentConvId) || null;
        }

        function saveCurrentConversation() {
            const conv = getCurrentConv();
            if (!conv) return;
            conv.messages = messages.slice();
            conv.updatedAt = Date.now();
            const firstUser = messages.find(m => m.role === 'user');
            if (firstUser) {
                const title = firstUser.content.slice(0, 20) + (firstUser.content.length > 20 ? '…' : '');
                conv.title = title || '新对话';
            } else {
                conv.title = '空对话';
            }
            saveConversations();
        }

        function createNewConversation() {
            const conv = {
                id: 'conv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                title: '新对话',
                messages: [],
                createdAt: Date.now(),
                updatedAt: Date.now(),
            };
            conversations.unshift(conv);
            currentConvId = conv.id;
            messages = [];
            saveConversations();
            renderConversationList();
            renderMessages();
            closeSidebar();
            showToast('✨ 新对话已创建');
            return conv;
        }

        function loadConversation(id) {
            if (isStreaming || isDebating) { stopAllStreams(); }
            saveCurrentConversation();
            const conv = conversations.find(c => c.id === id);
            if (!conv) return;
            currentConvId = id;
            messages = conv.messages || [];
            saveConversations();
            renderConversationList();
            renderMessages();
            closeSidebar();
            showToast(`已加载: ${conv.title}`);
        }

        function deleteConversation(id) {
            if (conversations.length <= 1) { showToast('至少保留一个对话'); return; }
            if (isStreaming || isDebating) { stopAllStreams(); }
            if (!confirm('确定删除此对话吗？')) return;
            const idx = conversations.findIndex(c => c.id === id);
            if (idx === -1) return;
            conversations.splice(idx, 1);
            if (currentConvId === id) {
                currentConvId = conversations[0]?.id || null;
                if (currentConvId) {
                    const conv = conversations.find(c => c.id === currentConvId);
                    messages = conv ? conv.messages || [] : [];
                } else {
                    messages = [];
                    if (conversations.length === 0) {
                        const newConv = { id: 'conv_' + Date.now(), title: '新对话', messages: [], createdAt: Date.now(),
                            updatedAt: Date.now() };
                        conversations.push(newConv);
                        currentConvId = newConv.id;
                        messages = [];
                    }
                }
            }
            saveConversations();
            renderConversationList();
            renderMessages();
            showToast('已删除对话');
        }

        function renameConversation(id) {
            const conv = conversations.find(c => c.id === id);
            if (!conv) return;
            const newTitle = prompt('输入新的对话标题：', conv.title);
            if (newTitle !== null && newTitle.trim() !== '') {
                conv.title = newTitle.trim();
                conv.updatedAt = Date.now();
                saveConversations();
                renderConversationList();
                showToast('✅ 已重命名');
            }
        }

        // ---------- 渲染消息 ----------
        function renderMessages() {
            const children = messagesEl.querySelectorAll('.message');
            children.forEach(el => el.remove());
            if (welcomeEl) welcomeEl.style.display = 'none';
            if (!messages || messages.length === 0) { welcomeEl.style.display = 'flex'; return; }
            for (const msg of messages) { addMessageElement(msg, false); }
            scrollToBottomIfNeeded();
        }

        function addMessageElement(msg, isStreamingMsg = false) {
            if (welcomeEl) welcomeEl.style.display = 'none';
            const div = document.createElement('div');
            let roleClass = msg.role === 'user' ? 'user' : 'agent';
            if (msg.role === 'divider') roleClass = 'divider';
            div.className = `message ${roleClass}`;
            div.dataset.id = msg.id || genId();

            if (msg.role !== 'divider') {
                const header = document.createElement('div');
                header.className = 'msg-header';
                if (msg.role === 'user') {
                    header.innerHTML = `<span class="avatar">👤</span><span class="name">你</span>`;
                } else {
                    const agent = agents.find(a => a.id === msg.agentId);
                    const avatar = agent?.avatar || '🤖';
                    const name = agent?.name || 'AI';
                    header.innerHTML = `<span class="avatar">${avatar}</span><span class="name">${escapeHtml(name)}</span>`;
                }
                div.appendChild(header);
            }

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (msg.error) bubble.classList.add('error-bubble');
            if (msg.interrupted) bubble.classList.add('interrupted-bubble');
            if (msg.silent) bubble.classList.add('silent-bubble');

            if (msg.role === 'divider') {
                bubble.textContent = msg.content || '─── 阶段 ───';
            } else {
                bubble.innerHTML = formatContent(msg.content || '');
            }
            div.appendChild(bubble);

            if (isStreamingMsg && msg.role !== 'divider') {
                const cursor = document.createElement('span');
                cursor.className = 'cursor-blink';
                bubble.appendChild(cursor);
            }

            messagesEl.appendChild(div);
            return { element: div, bubble };
        }

        function updateStreamingMessage(msgId, content) {
            const items = messagesEl.querySelectorAll('.message');
            for (const el of items) {
                if (el.dataset.id === msgId) {
                    const bubble = el.querySelector('.bubble');
                    if (bubble) {
                        const oldCursor = bubble.querySelector('.cursor-blink');
                        if (oldCursor) oldCursor.remove();
                        bubble.innerHTML = formatContent(content);
                        const cursor = document.createElement('span');
                        cursor.className = 'cursor-blink';
                        bubble.appendChild(cursor);
                        scrollToBottomIfNeeded();
                    }
                    return true;
                }
            }
            return false;
        }

        function finishStreamingMessage(msgId, content, error = false, interrupted = false) {
            const items = messagesEl.querySelectorAll('.message');
            for (const el of items) {
                if (el.dataset.id === msgId) {
                    const bubble = el.querySelector('.bubble');
                    if (bubble) {
                        const cursor = bubble.querySelector('.cursor-blink');
                        if (cursor) cursor.remove();
                        if (error) bubble.classList.add('error-bubble');
                        if (interrupted) bubble.classList.add('interrupted-bubble');
                        bubble.innerHTML = formatContent(content);
                        scrollToBottomIfNeeded();
                    }
                    return true;
                }
            }
            return false;
        }

        function addDivider(text) {
            const msg = { id: genId(), role: 'divider', content: text, timestamp: Date.now() };
            messages.push(msg);
            addMessageElement(msg, false);
            saveCurrentConversation();
            scrollToBottomIfNeeded();
        }

        function formatContent(text) {
            if (!text) return '';
            let html = escapeHtml(text);
            html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${escapeHtml(code.trim())}</code></pre>`);
            html = html.replace(/`([^`]+)`/g, (_, code) => `<code>${escapeHtml(code)}</code>`);
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        let autoScroll = true;

        function scrollToBottomIfNeeded() {
            if (autoScroll) {
                requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
            }
        }

        messagesEl.addEventListener('scroll', () => {
            const threshold = 50;
            const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < threshold;
            autoScroll = atBottom;
        });

        // ---------- 渲染对话列表 ----------
        function renderConversationList() {
            if (conversations.length === 0) {
                convListEl.innerHTML = `<div class="conv-empty">暂无对话</div>`;
                return;
            }
            let html = '';
            for (const conv of conversations) {
                const active = conv.id === currentConvId ? 'active' : '';
                const title = conv.title || '新对话';
                const count = conv.messages ? conv.messages.length : 0;
                const time = new Date(conv.updatedAt || conv.createdAt);
                const timeStr = time.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }) +
                    ' ' + time.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                html += `
                    <div class="conv-item ${active}" data-id="${conv.id}">
                        <div class="conv-info">
                            <div class="conv-title">${escapeHtml(title)}</div>
                            <div class="conv-meta">${timeStr} · ${count} 条</div>
                        </div>
                        <div class="conv-actions">
                            <button class="rename-btn" data-id="${conv.id}" title="重命名">✎</button>
                            <button class="delete-btn" data-id="${conv.id}" title="删除">✕</button>
                        </div>
                    </div>
                `;
            }
            convListEl.innerHTML = html;
            convListEl.querySelectorAll('.conv-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.conv-actions')) return;
                    const id = item.dataset.id;
                    if (id !== currentConvId) loadConversation(id);
                });
                const renameBtn = item.querySelector('.rename-btn');
                if (renameBtn) {
                    renameBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        renameConversation(item.dataset.id);
                    });
                }
                const delBtn = item.querySelector('.delete-btn');
                if (delBtn) {
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteConversation(item.dataset.id);
                    });
                }
            });
        }

        // ---------- @下拉菜单 ----------
        function renderAtDropdown() {
            const enabled = getEnabledAgents();
            let html =
                `<div class="at-dropdown-item ${atTargets.length === 0 ? 'active' : ''}" data-id="__all"><span>🌐 全部</span><span class="check">✓</span></div>`;
            for (const agent of enabled) {
                const checked = atTargets.includes(agent.id);
                html += `
                    <div class="at-dropdown-item ${checked ? 'active' : ''}" data-id="${agent.id}">
                        <span class="at-avatar">${agent.avatar || '🤖'}</span>
                        <span>${escapeHtml(agent.name)}</span>
                        <span class="check">✓</span>
                    </div>`;
            }
            atDropdown.innerHTML = html;
            if (atTargets.length === 0) atLabel.textContent = '@ 全部';
            else {
                const names = atTargets.map(id => { const a = agents.find(ag => ag.id === id); return a ? a.name : '?'; });
                if (names.length <= 2) atLabel.textContent = '@ ' + names.join(', ');
                else atLabel.textContent = '@ ' + names.slice(0, 2).join(', ') + ` +${names.length - 2}`;
            }
            atDropdown.querySelectorAll('.at-dropdown-item').forEach(item => {
                item.addEventListener('click', () => {
                    const id = item.dataset.id;
                    if (id === '__all') { atTargets = []; } else {
                        const idx = atTargets.indexOf(id);
                        if (idx !== -1) atTargets.splice(idx, 1);
                        else atTargets.push(id);
                    }
                    renderAtDropdown();
                });
            });
        }

        function toggleAtDropdown() {
            const isOpen = atDropdown.classList.toggle('open');
            atArrow.classList.toggle('open', isOpen);
            if (isOpen) renderAtDropdown();
        }

        function closeAtDropdown() {
            atDropdown.classList.remove('open');
            atArrow.classList.remove('open');
        }

        function getTargetAgents() {
            if (atTargets.length === 0) return getEnabledAgents();
            else return agents.filter(a => atTargets.includes(a.id) && a.enabled);
        }

        function getEnabledAgents() { return agents.filter(a => a.enabled); }

        function getAgentConfig(agentId) {
            const agent = agents.find(a => a.id === agentId);
            if (!agent) return null;
            return configs.find(c => c.id === agent.configId) || null;
        }

        function genId() { return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6); }

        function showToast(msg) {
            const existing = document.querySelector('.toast-tip');
            if (existing) existing.remove();
            const div = document.createElement('div');
            div.className = 'toast-tip';
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => {
                div.style.opacity = '0';
                div.style.transition = 'opacity 0.3s';
                setTimeout(() => div.remove(), 400);
            }, 2500);
        }

        function setInputEnabled(enabled) {
            inputBox.disabled = !enabled;
            if (!enabled) {
                sendBtn.classList.add('stop-btn');
                sendBtn.textContent = '⏹';
                sendBtn.disabled = false;
                sendBtn.title = '停止生成';
            } else {
                sendBtn.classList.remove('stop-btn');
                sendBtn.textContent = '➤';
                sendBtn.disabled = false;
                sendBtn.title = '发送';
            }
        }

        function autoResize() {
            inputBox.style.height = 'auto';
            inputBox.style.height = Math.min(inputBox.scrollHeight, 100) + 'px';
        }

        inputBox.addEventListener('focus', () => {
            setTimeout(() => {
                inputBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
                scrollToBottomIfNeeded();
            }, 300);
        });

        // ---------- 群聊模式 ----------
        function toggleGroupMode() {
            groupChatMode = !groupChatMode;
            groupBtn.classList.toggle('active', groupChatMode);
            groupBtn.textContent = groupChatMode ? '👥 群聊 ON' : '👥 群聊';
            showToast(groupChatMode ? '✅ 群聊模式已开启，AI将自由选择是否回复' : '❌ 群聊模式已关闭');
        }

        // ---------- 导出/导入（多选） ----------
        function showExportModal() {
            // 构建选择列表
            let html = `<div style="margin-bottom:12px; color:#8888aa;">选择要导出的内容：</div>`;
            html += `<div style="margin-bottom:8px; font-weight:500;">API 配置</div>`;
            if (configs.length === 0) html += `<div style="color:#555577; padding-left:10px;">暂无配置</div>`;
            else {
                for (const c of configs) {
                    html += `<div class="export-select-item"><input type="checkbox" class="export-check" data-type="config" value="${c.id}" checked /><label>${escapeHtml(c.name)}</label></div>`;
                }
            }
            html += `<div style="margin:8px 0; font-weight:500;">AI 角色</div>`;
            if (agents.length === 0) html += `<div style="color:#555577; padding-left:10px;">暂无角色</div>`;
            else {
                for (const a of agents) {
                    html += `<div class="export-select-item"><input type="checkbox" class="export-check" data-type="agent" value="${a.id}" checked /><label>${a.avatar || '🤖'} ${escapeHtml(a.name)}</label></div>`;
                }
            }
            html += `<div style="margin:8px 0; font-weight:500;">对话记录</div>`;
            if (conversations.length === 0) html += `<div style="color:#555577; padding-left:10px;">暂无对话</div>`;
            else {
                for (const conv of conversations) {
                    const count = conv.messages ? conv.messages.length : 0;
                    html += `<div class="export-select-item"><input type="checkbox" class="export-check" data-type="conversation" value="${conv.id}" checked /><label>${escapeHtml(conv.title)} <span class="badge">(${count}条)</span></label></div>`;
                }
            }
            html += `<div style="margin-top:12px;"><button class="btn-secondary" id="exportSelectAll" style="padding:6px 0; width:100%;">全选</button></div>`;

            modalTitle.textContent = '📤 导出数据';
            modalBody.innerHTML = html;
            modalDelete.style.display = 'none';
            modalSave.textContent = '导出';
            modalCancel.textContent = '取消';
            modalFooter.style.display = 'flex';

            // 全选/取消全选逻辑
            let allChecked = true;
            const checkboxes = modalBody.querySelectorAll('.export-check');
            const selectAllBtn = modalBody.querySelector('#exportSelectAll');
            if (selectAllBtn) {
                selectAllBtn.addEventListener('click', function() {
                    const cbs = modalBody.querySelectorAll('.export-check');
                    const all = Array.from(cbs).every(cb => cb.checked);
                    cbs.forEach(cb => cb.checked = !all);
                    this.textContent = all ? '全选' : '取消全选';
                });
            }

            modalSave.onclick = function() {
                const selected = {
                    configs: [],
                    agents: [],
                    conversations: []
                };
                modalBody.querySelectorAll('.export-check:checked').forEach(cb => {
                    const type = cb.dataset.type;
                    const val = cb.value;
                    if (type === 'config') selected.configs.push(val);
                    else if (type === 'agent') selected.agents.push(val);
                    else if (type === 'conversation') selected.conversations.push(val);
                });
                if (selected.configs.length === 0 && selected.agents.length === 0 && selected.conversations.length === 0) {
                    showToast('请至少选择一项');
                    return;
                }
                doExport(selected);
                closeModal();
            };
            modalCancel.onclick = closeModal;
            modalCloseBtn.onclick = closeModal;
            openModal();
        }

        function doExport(selected) {
            try {
                const exportData = {
                    version: '1.0',
                    exportDate: new Date().toISOString(),
                    configs: configs.filter(c => selected.configs.includes(c.id)),
                    agents: agents.filter(a => selected.agents.includes(a.id)),
                    conversations: conversations.filter(c => selected.conversations.includes(c.id)),
                    currentConfigId: currentConfigId,
                    currentConvId: currentConvId,
                };
                // 如果当前选中的配置或对话不在导出列表中，清除引用
                if (!exportData.configs.some(c => c.id === exportData.currentConfigId)) exportData.currentConfigId = null;
                if (!exportData.conversations.some(c => c.id === exportData.currentConvId)) exportData.currentConvId = null;

                const json = JSON.stringify(exportData, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `ai_chat_backup_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('✅ 数据已导出，文件已保存到您的下载目录，请查看浏览器下载栏。');
            } catch (err) { showToast('❌ 导出失败：' + err.message); }
        }

        function showImportModal() {
            let html = `<div style="margin-bottom:12px; color:#8888aa;">选择要导入的数据类型：</div>`;
            html += `<div class="export-select-item"><input type="checkbox" class="import-type-check" value="configs" checked /><label>API 配置</label></div>`;
            html += `<div class="export-select-item"><input type="checkbox" class="import-type-check" value="agents" checked /><label>AI 角色</label></div>`;
            html += `<div class="export-select-item"><input type="checkbox" class="import-type-check" value="conversations" checked /><label>对话记录</label></div>`;
            html += `<div style="margin-top:12px; color:#8888aa; font-size:13px;">请选择备份文件</div>`;
            html += `<input type="file" id="importFileSelect" accept=".json" style="margin-top:6px; width:100%; padding:8px; background:#0d0d1a; border:1px solid rgba(255,255,255,0.08); border-radius:10px; color:#e8e8f0;" />`;

            modalTitle.textContent = '📥 导入数据';
            modalBody.innerHTML = html;
            modalDelete.style.display = 'none';
            modalSave.textContent = '导入';
            modalCancel.textContent = '取消';
            modalFooter.style.display = 'flex';

            modalSave.onclick = function() {
                const types = [];
                modalBody.querySelectorAll('.import-type-check:checked').forEach(cb => types.push(cb.value));
                if (types.length === 0) { showToast('请至少选择一种类型'); return; }
                const fileInput = document.getElementById('importFileSelect');
                if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
                    showToast('请选择备份文件');
                    return;
                }
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data.configs || !data.agents || !data.conversations) {
                            throw new Error('数据格式无效');
                        }
                        if (!confirm(`导入将覆盖当前选中的数据类型（${types.join(', ')}），确定继续吗？`)) return;
                        if (types.includes('configs')) {
                            configs = data.configs || [];
                            if (data.currentConfigId && configs.some(c => c.id === data.currentConfigId)) {
                                currentConfigId = data.currentConfigId;
                            } else {
                                currentConfigId = configs[0]?.id || null;
                            }
                            saveConfigs();
                        }
                        if (types.includes('agents')) {
                            agents = data.agents || [];
                            for (const a of agents) {
                                if (!configs.some(c => c.id === a.configId)) {
                                    a.configId = configs[0]?.id || null;
                                }
                                const cfg = configs.find(c => c.id === a.configId);
                                if (cfg && a.model && !cfg.models.includes(a.model)) {
                                    a.model = cfg.models[0] || '';
                                }
                            }
                            saveAgents();
                        }
                        if (types.includes('conversations')) {
                            conversations = data.conversations || [];
                            if (data.currentConvId && conversations.some(c => c.id === data.currentConvId)) {
                                currentConvId = data.currentConvId;
                            } else {
                                currentConvId = conversations[0]?.id || null;
                            }
                            saveConversations();
                            loadCurrentConvMessages();
                        }
                        renderConversationList();
                        renderAtDropdown();
                        renderApiConfigList();
                        renderAgentConfigList();
                        showToast('✅ 数据导入成功');
                    } catch (err) { showToast('❌ 导入失败：' + err.message); }
                };
                reader.onerror = function() { showToast('❌ 读取文件失败'); };
                reader.readAsText(file);
                closeModal();
            };
            modalCancel.onclick = closeModal;
            modalCloseBtn.onclick = closeModal;
            openModal();
        }

        // ---------- 模态框控制 ----------
        function openModal() {
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            modalBody.innerHTML = '';
            modalDelete.style.display = 'none';
            modalFooter.style.display = 'flex';
            editingId = null;
            editingType = null;
            modalCallback = null;
        }

        // ---------- 附件 ----------
        function handleFiles(files) {
            if (!files || files.length === 0) return;
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const isText = file.type.startsWith('text/') || file.name.match(/\.(txt|md|json|js|css|html|xml|yml|yaml|log|csv|tsv|py|java|c|cpp|h|sh|bat|ps1|rb|go|rs|swift|kt|dart)$/i);
                const isImage = file.type.startsWith('image/');
                if (isText) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        uploadedFiles.push({ file, dataUrl: null, content: e.target.result, isText: true,
                            isImage: false });
                        renderAttachments();
                        showToast(`✅ 已附加文本文件: ${file.name}`);
                    };
                    reader.onerror = function() { showToast('❌ 读取文件失败'); };
                    reader.readAsText(file);
                } else if (isImage) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        uploadedFiles.push({ file, dataUrl: e.target.result, content: null, isText: false,
                            isImage: true });
                        renderAttachments();
                        showToast(`✅ 已附加图片: ${file.name}`);
                    };
                    reader.onerror = function() { showToast('❌ 读取图片失败'); };
                    reader.readAsDataURL(file);
                } else {
                    uploadedFiles.push({ file, dataUrl: null, content: null, isText: false, isImage: false });
                    renderAttachments();
                    showToast(`📎 已附加文件: ${file.name}`);
                }
            }
        }

        function renderAttachments() {
            if (uploadedFiles.length === 0) { fileTip.classList.remove('show');
                fileTip.innerHTML = ''; return; }
            fileTip.classList.add('show');
            let html = '';
            for (let i = 0; i < uploadedFiles.length; i++) {
                const item = uploadedFiles[i];
                const file = item.file;
                let previewHtml = item.isImage && item.dataUrl ? `<img src="${item.dataUrl}" alt="${escapeHtml(file.name)}" />` :
                    `<span class="file-icon">📎</span>`;
                html += `
                    <div class="file-item" data-index="${i}">
                        <div class="preview">${previewHtml}<span class="file-name">${escapeHtml(file.name)}</span></div>
                        <button class="remove-attachment" data-index="${i}" title="移除">✕</button>
                    </div>`;
            }
            fileTip.innerHTML = html;
            fileTip.querySelectorAll('.remove-attachment').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(e.target.dataset.index, 10);
                    if (idx >= 0 && idx < uploadedFiles.length) {
                        uploadedFiles.splice(idx, 1);
                        renderAttachments();
                        if (uploadedFiles.length === 0) showToast('已移除所有附件');
                        else showToast('已移除一个附件');
                    }
                });
            });
        }

        function clearAllAttachments() { uploadedFiles = [];
            renderAttachments(); }

        // ---------- 流式 ----------
        async function streamAgent(agent, messages_payload, msgId, onUpdate, onDone, onError) {
            const cfg = getAgentConfig(agent.id);
            if (!cfg) { onError(new Error('未绑定API配置')); return; }
            const { apiBase, apiKey, model, maxTokens } = cfg;
            const url = `${apiBase.replace(/\/+$/, '')}/chat/completions`;
            const controller = new AbortController();
            activeControllers.push(controller);
            streamingMsgIds.add(msgId);
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model, messages: messages_payload, stream: true, temperature: 0.8,
                        max_tokens: maxTokens || 4096 }),
                    signal: controller.signal,
                });
                if (!response.ok) {
                    let errMsg = `HTTP ${response.status}`;
                    try { const errData = await response.json();
                        errMsg = errData.error?.message || errMsg; } catch (_) {}
                    throw new Error(errMsg);
                }
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '',
                    fullContent = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data:')) continue;
                        const data = trimmed.slice(5).trim();
                        if (data === '[DONE]') continue;
                        try {
                            const json = JSON.parse(data);
                            const delta = json.choices?.[0]?.delta?.content;
                            if (delta) { fullContent += delta;
                                onUpdate(fullContent); }
                        } catch (_) {}
                    }
                }
                onDone(fullContent);
            } catch (err) {
                if (err.name === 'AbortError') { onError(new Error('已中断'), true); } else { onError(err); }
            } finally {
                const idx = activeControllers.indexOf(controller);
                if (idx !== -1) activeControllers.splice(idx, 1);
                streamingMsgIds.delete(msgId);
                if (streamingMsgIds.size === 0) { isStreaming = false;
                    setInputEnabled(true);
                    sendBtn.disabled = false; }
            }
        }

        function stopAllStreams() {
            if (activeControllers.length === 0) return;
            for (const ctrl of activeControllers) ctrl.abort();
            activeControllers = [];
            for (const msgId of streamingMsgIds) {
                const msg = messages.find(m => m.id === msgId);
                if (msg) {
                    msg.interrupted = true;
                    msg.content = (msg.content || '') + ' (已中断)';
                    finishStreamingMessage(msgId, msg.content, false, true);
                }
            }
            streamingMsgIds.clear();
            isStreaming = false;
            setInputEnabled(true);
            sendBtn.disabled = false;
            showToast('⏹ 已停止生成');
            saveCurrentConversation();
            renderConversationList();
        }

        // ---------- 快速回复 ----------
        async function quickReply(text) {
            if (!text && uploadedFiles.length === 0) { showToast('请输入消息或上传文件'); return; }
            if (isStreaming) return;
            let targets = getTargetAgents();
            if (targets.length === 0) { showToast('没有启用的AI'); return; }
            if (groupChatMode) {
                targets = targets.filter(agent => Math.random() < 0.4);
                if (targets.length === 0) {
                    const silentMsg = { id: genId(), role: 'divider', content: '💤 所有AI都选择了旁观，无人发言',
                        timestamp: Date.now() };
                    messages.push(silentMsg);
                    addMessageElement(silentMsg, false);
                    saveCurrentConversation();
                    scrollToBottomIfNeeded();
                    showToast('💤 所有AI保持沉默');
                    return;
                }
            }
            for (const agent of targets) {
                const cfg = getAgentConfig(agent.id);
                if (!cfg || !cfg.apiKey) { showToast(`⚠️ "${agent.name}" 缺少API配置`); return; }
            }
            isStreaming = true;
            setInputEnabled(false);
            sendBtn.disabled = false;
            inputBox.value = '';
            inputBox.style.height = 'auto';

            let userContent = text || '';
            for (const item of uploadedFiles) {
                const file = item.file;
                if (item.isText && item.content) userContent += `\n\n[附件: ${file.name}]\n${item.content}`;
                else if (item.isImage) userContent += `\n\n[图片: ${file.name}]`;
                else userContent += `\n\n[文件: ${file.name}]`;
            }
            const userMsg = { id: genId(), role: 'user', content: userContent, timestamp: Date.now() };
            messages.push(userMsg);
            addMessageElement(userMsg, false);
            saveCurrentConversation();
            scrollToBottomIfNeeded();
            clearAllAttachments();

            const promises = targets.map(async (agent) => {
                const msgId = genId();
                const msg = { id: msgId, role: 'agent', agentId: agent.id, content: '', timestamp: Date.now(),
                    streaming: true };
                messages.push(msg);
                addMessageElement(msg, true);
                saveCurrentConversation();
                scrollToBottomIfNeeded();
                const history = messages.filter(m => m.id !== msgId && m.role !== 'system' && !m.interrupted).slice(-10);
                const payload = [];
                const sysPrompt = agent.prompt || '你是一个乐于助人的AI助手。';
                payload.push({ role: 'system', content: sysPrompt });
                for (const m of history) {
                    if (m.role === 'user') payload.push({ role: 'user', content: m.content });
                    else if (m.role === 'agent' && m.agentId) {
                        const a = agents.find(ag => ag.id === m.agentId);
                        if (a) payload.push({ role: 'assistant', content: `[${a.name}]: ${m.content}` });
                        else payload.push({ role: 'assistant', content: m.content });
                    }
                }
                payload.push({ role: 'user', content: userContent });
                await streamAgent(agent, payload, msgId,
                    (content) => { updateStreamingMessage(msgId, content); const m = messages.find(mm => mm.id === msgId); if (
                            m) m.content = content; },
                    (content) => { const m = messages.find(mm => mm.id === msgId); if (m) { m.content = content;
                            m.streaming = false; } finishStreamingMessage(msgId, content, false, false);
                        saveCurrentConversation();
                        renderConversationList(); },
                    (err, interrupted = false) => {
                        const errMsg = interrupted ? '已中断' : `❌ ${err.message || '请求失败'}`;
                        const m = messages.find(mm => mm.id === msgId);
                        if (m) { m.content = errMsg;
                            m.error = !interrupted;
                            m.interrupted = interrupted;
                            m.streaming = false; }
                        finishStreamingMessage(msgId, errMsg, !interrupted, interrupted);
                        saveCurrentConversation();
                        renderConversationList(); }
                );
            });
            await Promise.allSettled(promises);
            if (streamingMsgIds.size === 0) { isStreaming = false;
                setInputEnabled(true);
                sendBtn.disabled = false; }
            saveCurrentConversation();
            renderConversationList();
            inputBox.focus();
        }

        // ---------- 辩论 ----------
        async function callAgentStreamForDebate(agent, roundName, userText, history, msgId, attachments) {
            const cfg = getAgentConfig(agent.id);
            if (!cfg) throw new Error('未绑定API配置');
            const { apiBase, apiKey, model, maxTokens } = cfg;
            const url = `${apiBase.replace(/\/+$/, '')}/chat/completions`;
            let historyText = '';
            if (history.length > 0) historyText = history.map(h => `${h.name}: ${h.content}`).join('\n\n');
            let systemPrompt = agent.prompt || '你是一个乐于助人的AI助手。';
            let fileParts = '';
            for (const item of attachments) {
                const file = item.file;
                if (item.isText && item.content) fileParts += `\n\n[附件: ${file.name}]\n${item.content}`;
                else if (item.isImage) fileParts += `\n\n[图片: ${file.name}]`;
                else fileParts += `\n\n[文件: ${file.name}]`;
            }
            let userPrompt = '';
            switch (roundName) {
                case '初步看法':
                    userPrompt = `用户问题：${userText}${fileParts}\n\n请给出你的初步看法，直接阐述你的观点和理由。`;
                    break;
                case '相互评价':
                    userPrompt =
                        `用户问题：${userText}${fileParts}\n\n【各AI的初步看法】\n${historyText}\n\n请结合你自己的看法，客观评价其他AI的观点，指出异同、补充或质疑。`;
                    break;
                case '自由辩论第一轮':
                case '自由辩论第二轮':
                    userPrompt =
                        `用户问题：${userText}${fileParts}\n\n【上一轮讨论记录】\n${historyText}\n\n请继续进行自由辩论，你可以反驳他人的观点、维护自己的立场或提出新的论据。${roundName === '自由辩论第二轮' ? ' 这是最后一轮，请做出总结性陈述。' : ''}`;
                    break;
                default:
                    userPrompt = `用户问题：${userText}${fileParts}\n\n请给出你的看法。`;
            }
            const payload = [{ role: 'system', content: systemPrompt }, { role: 'user', content: userPrompt }];
            const controller = new AbortController();
            activeControllers.push(controller);
            streamingMsgIds.add(msgId);
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model, messages: payload, stream: true, temperature: 0.8,
                        max_tokens: maxTokens || 4096 }),
                    signal: controller.signal,
                });
                if (!response.ok) {
                    let errMsg = `HTTP ${response.status}`;
                    try { const errData = await response.json();
                        errMsg = errData.error?.message || errMsg; } catch (_) {}
                    throw new Error(errMsg);
                }
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '',
                    fullContent = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data:')) continue;
                        const data = trimmed.slice(5).trim();
                        if (data === '[DONE]') continue;
                        try {
                            const json = JSON.parse(data);
                            const delta = json.choices?.[0]?.delta?.content;
                            if (delta) { fullContent += delta;
                                updateStreamingMessage(msgId, fullContent);
                                const m = messages.find(mm => mm.id === msgId); if (m) m.content = fullContent; }
                        } catch (_) {}
                    }
                }
                const m = messages.find(mm => mm.id === msgId);
                if (m) { m.content = fullContent;
                    m.streaming = false; }
                finishStreamingMessage(msgId, fullContent, false, false);
                saveCurrentConversation();
                renderConversationList();
                return fullContent;
            } catch (err) {
                if (err.name === 'AbortError') {
                    const m = messages.find(mm => mm.id === msgId);
                    if (m) { m.content = (m.content || '') + ' (已中断)';
                        m.interrupted = true;
                        m.streaming = false; }
                    finishStreamingMessage(msgId, m?.content || '已中断', false, true);
                    saveCurrentConversation();
                    renderConversationList();
                    return '已中断';
                } else {
                    const errMsg = `❌ ${err.message || '请求失败'}`;
                    const m = messages.find(mm => mm.id === msgId);
                    if (m) { m.content = errMsg;
                        m.error = true;
                        m.streaming = false; }
                    finishStreamingMessage(msgId, errMsg, true, false);
                    saveCurrentConversation();
                    renderConversationList();
                    return errMsg;
                }
            } finally {
                const idx = activeControllers.indexOf(controller);
                if (idx !== -1) activeControllers.splice(idx, 1);
                streamingMsgIds.delete(msgId);
            }
        }

        async function runDebateRound(roundName, userText, agents, history, onComplete, attachments) {
            const promises = agents.map(async (agent) => {
                const msgId = genId();
                const msg = { id: msgId, role: 'agent', agentId: agent.id, content: '', timestamp: Date.now(),
                    streaming: true };
                messages.push(msg);
                addMessageElement(msg, true);
                saveCurrentConversation();
                scrollToBottomIfNeeded();
                try {
                    const content = await callAgentStreamForDebate(agent, roundName, userText, history, msgId,
                    attachments);
                    if (content !== '已中断') {
                        const m = messages.find(mm => mm.id === msgId);
                        if (m) m.content = content;
                        finishStreamingMessage(msgId, content, false, false);
                    }
                    if (onComplete) onComplete(agent, content);
                    return content;
                } catch (err) {}
            });
            await Promise.allSettled(promises);
            await new Promise(r => setTimeout(r, 200));
        }

        async function startDebate() {
            const text = inputBox.value.trim();
            if (!text && uploadedFiles.length === 0) { showToast('请输入话题或上传文件'); return; }
            if (isStreaming || isDebating) return;
            const targets = getTargetAgents();
            if (targets.length < 2) { showToast('至少需要 2 个启用的 AI 才能开始讨论'); return; }
            for (const agent of targets) {
                const cfg = getAgentConfig(agent.id);
                if (!cfg || !cfg.apiKey) { showToast(`⚠️ "${agent.name}" 缺少API配置`); return; }
            }
            isDebating = true;
            isStreaming = true;
            debateBtn.disabled = true;
            setInputEnabled(false);
            sendBtn.disabled = false;
            inputBox.value = '';
            inputBox.style.height = 'auto';

            let userContent = text || '';
            const attachmentsCopy = uploadedFiles.slice();
            for (const item of attachmentsCopy) {
                const file = item.file;
                if (item.isText && item.content) userContent += `\n\n[附件: ${file.name}]\n${item.content}`;
                else if (item.isImage) userContent += `\n\n[图片: ${file.name}]`;
                else userContent += `\n\n[文件: ${file.name}]`;
            }
            const userMsg = { id: genId(), role: 'user', content: userContent, timestamp: Date.now() };
            messages.push(userMsg);
            addMessageElement(userMsg, false);
            saveCurrentConversation();
            scrollToBottomIfNeeded();
            clearAllAttachments();

            let debateHistory = [];
            addDivider('📌 阶段一：各 AI 发表初步看法');
            await runDebateRound('初步看法', text, targets, debateHistory, (agent, content) => {
                if (content !== '已中断') debateHistory.push({ round: 'opinion', agentId: agent.id, name: agent.name,
                    content });
            }, attachmentsCopy);
            if (streamingMsgIds.size > 0 || activeControllers.length > 0) {
                isDebating = false;
                isStreaming = false;
                debateBtn.disabled = false;
                setInputEnabled(true);
                sendBtn.disabled = false;
                showToast('⏹ 讨论已中断');
                saveCurrentConversation();
                renderConversationList();
                return;
            }
            addDivider('🔍 阶段二：相互评价与补充');
            await runDebateRound('相互评价', text, targets, debateHistory, (agent, content) => {
                if (content !== '已中断') debateHistory.push({ round: 'review', agentId: agent.id, name: agent.name,
                    content });
            }, attachmentsCopy);
            if (streamingMsgIds.size > 0 || activeControllers.length > 0) {
                isDebating = false;
                isStreaming = false;
                debateBtn.disabled = false;
                setInputEnabled(true);
                sendBtn.disabled = false;
                showToast('⏹ 讨论已中断');
                saveCurrentConversation();
                renderConversationList();
                return;
            }
            addDivider('⚡ 阶段三：自由辩论 · 第一轮');
            await runDebateRound('自由辩论第一轮', text, targets, debateHistory, (agent, content) => {
                if (content !== '已中断') debateHistory.push({ round: 'debate1', agentId: agent.id, name: agent.name,
                    content });
            }, attachmentsCopy);
            if (streamingMsgIds.size > 0 || activeControllers.length > 0) {
                isDebating = false;
                isStreaming = false;
                debateBtn.disabled = false;
                setInputEnabled(true);
                sendBtn.disabled = false;
                showToast('⏹ 讨论已中断');
                saveCurrentConversation();
                renderConversationList();
                return;
            }
            addDivider('⚡ 阶段四：自由辩论 · 第二轮（最终轮）');
            await runDebateRound('自由辩论第二轮', text, targets, debateHistory, (agent, content) => {
                if (content !== '已中断') debateHistory.push({ round: 'debate2', agentId: agent.id, name: agent.name,
                    content });
            }, attachmentsCopy);
            isDebating = false;
            isStreaming = false;
            debateBtn.disabled = false;
            setInputEnabled(true);
            sendBtn.disabled = false;
            inputBox.focus();
            saveCurrentConversation();
            renderConversationList();
            showToast('✅ 讨论结束');
        }

                        <div class="info">
                            <div class="name">${escapeHtml(c.name)}</div>

                        </div>
                    </div>
