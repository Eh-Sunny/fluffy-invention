        async function streamAgent(agent, messages_payload, msgId, onUpdate, onDone, onError) {
            const cfg = getAgentConfig(agent.id);
            if (!cfg) { onError(new Error('未绑定API配置')); return; }
            const { apiBase, apiKey, maxTokens } = cfg;
            const model = agent.model;   // ✅ 修复：模型存在 agent.model 上，而非 cfg.model
            if (!model || model.trim() === '') {
                onError(new Error(`AI角色 "${agent.name}" 未选择模型，请先在AI角色配置中绑定模型`));
                return;
            }
            const url = `${apiBase.replace(/\/+$/, '')}/chat/completions`;
            const controller = new AbortController();
            activeControllers.push(controller);
            streamingMsgIds.add(msgId);
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model, messages: messages_payload, stream: true, temperature: 0.8,
                        max_tokens: maxTokens || 4096 }),
                    signal: controller.signal,
                });
                if (!response.ok) {
                    let errMsg = `HTTP ${response.status}`;
                    try { const errData = await response.json();
                        errMsg = errData.error?.message || errMsg; } catch (_) {}
                    throw new Error(errMsg);
                }
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '',
                    fullContent = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data:')) continue;
                        const data = trimmed.slice(5).trim();
                        if (data === '[DONE]') continue;
                        try {
                            const json = JSON.parse(data);
                            const delta = json.choices?.[0]?.delta?.content;
                            if (delta) { fullContent += delta;
                                onUpdate(fullContent); }
                        } catch (_) {}
                    }
                }
                onDone(fullContent);
            } catch (err) {
                if (err.name === 'AbortError') { onError(new Error('已中断'), true); } else { onError(err); }
            } finally {
                const idx = activeControllers.indexOf(controller);
                if (idx !== -1) activeControllers.splice(idx, 1);
                streamingMsgIds.delete(msgId);
                if (streamingMsgIds.size === 0) { isStreaming = false;
                    setInputEnabled(true);
                    sendBtn.disabled = false; }
            }
        }

        function stopAllStreams() {
            if (activeControllers.length === 0) return;
            for (const ctrl of activeControllers) ctrl.abort();
            activeControllers = [];
            for (const msgId of streamingMsgIds) {
                const msg = messages.find(m => m.id === msgId);
                if (msg) {
                    msg.interrupted = true;
                    msg.content = (msg.content || '') + ' (已中断)';
                    finishStreamingMessage(msgId, msg.content, false, true);
                }
            }
            streamingMsgIds.clear();
            isStreaming = false;
            setInputEnabled(true);
            sendBtn.disabled = false;
            showToast('⏹ 已停止生成');
            saveCurrentConversation();
            renderConversationList();
        }

        // ===== 快速回复：群聊模式随机顺序 + 顺序执行 =====
        async function quickReply(text) {
            if (!text && uploadedFiles.length === 0) { showToast('请输入消息或上传文件'); return; }
            if (isStreaming) return;
            let targets = getTargetAgents();
            if (targets.length === 0) { showToast('没有启用的AI'); return; }

            // 校验（✅ 修复：model 从 agent.model 取）
            for (const agent of targets) {
                const cfg = getAgentConfig(agent.id);
                if (!cfg || !cfg.apiKey) { showToast(`⚠️ "${agent.name}" 缺少API配置`); return; }
                if (!agent.model || agent.model.trim() === '') {
                    showToast(`⚠️ "${agent.name}" 未选择模型，请前往AI角色配置绑定模型`);
                    return;
                }
            }

            // 群聊模式：随机打乱顺序
            if (groupChatMode) {
                targets = shuffleArray(targets);
                if (targets.length === 0) {
                    showToast('没有可发言的AI');
                    return;
                }
            }

            isStreaming = true;
            setInputEnabled(false);
            sendBtn.disabled = false;
            inputBox.value = '';
            inputBox.style.height = 'auto';

            let userContent = text || '';
            for (const item of uploadedFiles) {
                const file = item.file;
                if (item.isText && item.content) userContent += `\n\n[附件: ${file.name}]\n${item.content}`;
                else if (item.isImage) userContent += `\n\n[图片: ${file.name}]`;
                else userContent += `\n\n[文件: ${file.name}]`;
            }
            const userMsg = { id: genId(), role: 'user', content: userContent, timestamp: Date.now() };
            messages.push(userMsg);
            addMessageElement(userMsg, false);
            saveCurrentConversation();
            scrollToBottomIfNeeded();
            clearAllAttachments();

            // 构建知识库上下文
            let knowledgeContext = '';
            if (knowledge.length > 0) {
                const keywords = text.toLowerCase().split(/\s+/).filter(w => w.length > 1);
                const matched = knowledge.filter(k => {
                    const contentLower = (k.title + ' ' + (k.content || '')).toLowerCase();
                    return keywords.some(kw => contentLower.includes(kw));
                });
                if (matched.length > 0) {
                    knowledgeContext = '\n\n[知识库参考]\n' + matched.map(k => `- ${k.title}: ${k.content || '[文件]'}`).join(
                        '\n');
                }
            }

            let platformContext = '';
            const enabledPlatforms = platforms.filter(p => p.enabled);
            if (enabledPlatforms.length > 0) {
                platformContext = '\n\n[外部平台参考]\n' + enabledPlatforms.map(p => `- ${p.name}: 相关文档片段（模拟）`).join('\n');
            }

            // 定义单个 AI 的处理流程
            const processAgent = async (agent) => {
                const msgId = genId();
                const msg = { id: msgId, role: 'agent', agentId: agent.id, content: '', timestamp: Date.now(),
                    streaming: true };
                messages.push(msg);
                addMessageElement(msg, true);
                saveCurrentConversation();
                scrollToBottomIfNeeded();

                // 构建 payload：包含从对话开始到当前时刻的所有消息（包括前面 AI 的回复）
                const history = messages.filter(m => m.id !== msgId && m.role !== 'system' && !m.interrupted).slice(-20);
                const payload = [];
                const sysPrompt = agent.prompt || '你是一个乐于助人的AI助手。';
                payload.push({ role: 'system', content: sysPrompt });
                for (const m of history) {
                    if (m.role === 'user') payload.push({ role: 'user', content: m.content });
                    else if (m.role === 'agent' && m.agentId) {
                        const a = agents.find(ag => ag.id === m.agentId);
                        if (a) payload.push({ role: 'assistant', content: `[${a.name}]: ${m.content}` });
                        else payload.push({ role: 'assistant', content: m.content });
                    }
                }
                // 附加知识库与外部平台上下文
                const contextSuffix = (knowledgeContext + platformContext);
                if (contextSuffix) {
                    payload.push({ role: 'user', content: contextSuffix });
                }

                await streamAgent(agent, payload, msgId,
                    (content) => { updateStreamingMessage(msgId, content); const m = messages.find(mm => mm.id === msgId); if (
                            m) m.content = content; },
                    (content) => { const m = messages.find(mm => mm.id === msgId); if (m) { m.content = content;
                            m.streaming = false; } finishStreamingMessage(msgId, content, false, false);
                        saveCurrentConversation();
                        renderConversationList(); },
                    (err, interrupted = false) => {
                        const errMsg = interrupted ? '已中断' : `❌ ${err.message || '请求失败'}`;
                        const m = messages.find(mm => mm.id === msgId);
                        if (m) { m.content = errMsg;
                            m.error = !interrupted;
                            m.interrupted = interrupted;
                            m.streaming = false; }
                        finishStreamingMessage(msgId, errMsg, !interrupted, interrupted);
                        saveCurrentConversation();
                        renderConversationList(); }
                );
            };

            if (groupChatMode) {
                // 顺序执行：一个说完，下一个再说
                for (const agent of targets) {
                    if (!isStreaming) break;
                    await processAgent(agent);
                }
            } else {
                // 并行执行
                await Promise.allSettled(targets.map(agent => processAgent(agent)));
            }

            if (streamingMsgIds.size === 0) { isStreaming = false;
                setInputEnabled(true);
                sendBtn.disabled = false; }
            saveCurrentConversation();
            renderConversationList();
            inputBox.focus();
        }

        async function callAgentStreamForDebate(agent, roundName, userText, history, msgId, attachments) {
            const cfg = getAgentConfig(agent.id);
            if (!cfg) throw new Error('未绑定API配置');
            const { apiBase, apiKey, maxTokens } = cfg;
            const model = agent.model;   // ✅ 修复：模型存在 agent.model 上
            if (!model || model.trim() === '') {
                throw new Error(`AI角色 "${agent.name}" 未选择模型，请先在AI角色配置中绑定模型`);
            }
            const url = `${apiBase.replace(/\/+$/, '')}/chat/completions`;
            let historyText = '';
            if (history.length > 0) historyText = history.map(h => `${h.name}: ${h.content}`).join('\n\n');
            let systemPrompt = agent.prompt || '你是一个乐于助人的AI助手。';
            let fileParts = '';
            for (const item of attachments) {
                const file = item.file;
                if (item.isText && item.content) fileParts += `\n\n[附件: ${file.name}]\n${item.content}`;
                else if (item.isImage) fileParts += `\n\n[图片: ${file.name}]`;
                else fileParts += `\n\n[文件: ${file.name}]`;
            }
            let userPrompt = '';
            switch (roundName) {
                case '初步看法':
                    userPrompt = `用户问题：${userText}${fileParts}\n\n请给出你的初步看法，直接阐述你的观点和理由。`;
                    break;
                case '相互评价':
                    userPrompt =
                        `用户问题：${userText}${fileParts}\n\n【各AI的初步看法】\n${historyText}\n\n请结合你自己的看法，客观评价其他AI的观点，指出异同、补充或质疑。`;
                    break;
                case '自由辩论第一轮':
                case '自由辩论第二轮':
                    userPrompt =
                        `用户问题：${userText}${fileParts}\n\n【上一轮讨论记录】\n${historyText}\n\n请继续进行自由辩论，你可以反驳他人的观点、维护自己的立场或提出新的论据。${roundName === '自由辩论第二轮' ? ' 这是最后一轮，请做出总结性陈述。' : ''}`;
                    break;
                default:
                    userPrompt = `用户问题：${userText}${fileParts}\n\n请给出你的看法。`;
            }
            let knowledgeContext = '';
            if (knowledge.length > 0) {
                const keywords = userText.toLowerCase().split(/\s+/).filter(w => w.length > 1);
                const matched = knowledge.filter(k => {
                    const contentLower = (k.title + ' ' + (k.content || '')).toLowerCase();
                    return keywords.some(kw => contentLower.includes(kw));
                });
                if (matched.length > 0) {
                    knowledgeContext = '\n\n[知识库参考]\n' + matched.map(k => `- ${k.title}: ${k.content || '[文件]'}`).join(
                        '\n');
                }
            }
            userPrompt += knowledgeContext;

            const payload = [{ role: 'system', content: systemPrompt }, { role: 'user', content: userPrompt }];
            const controller = new AbortController();
            activeControllers.push(controller);
            streamingMsgIds.add(msgId);
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model, messages: payload, stream: true, temperature: 0.8,
                        max_tokens: maxTokens || 4096 }),
                    signal: controller.signal,
                });
                if (!response.ok) {
                    let errMsg = `HTTP ${response.status}`;
                    try { const errData = await response.json();
                        errMsg = errData.error?.message || errMsg; } catch (_) {}
                    throw new Error(errMsg);
                }
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '',
                    fullContent = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data:')) continue;
                        const data = trimmed.slice(5).trim();
                        if (data === '[DONE]') continue;
                        try {
                            const json = JSON.parse(data);
                            const delta = json.choices?.[0]?.delta?.content;
                            if (delta) { fullContent += delta;
                                updateStreamingMessage(msgId, fullContent);
                                const m = messages.find(mm => mm.id === msgId); if (m) m.content = fullContent; }
                        } catch (_) {}
                    }
                }
                const m = messages.find(mm => mm.id === msgId);
                if (m) { m.content = fullContent;
                    m.streaming = false; }
                finishStreamingMessage(msgId, fullContent, false, false);
                saveCurrentConversation();
                renderConversationList();
                return fullContent;
            } catch (err) {
                if (err.name === 'AbortError') {
                    const m = messages.find(mm => mm.id === msgId);
                    if (m) { m.content = (m.content || '') + ' (已中断)';
                        m.interrupted = true;
                        m.streaming = false; }
                    finishStreamingMessage(msgId, m?.content || '已中断', false, true);
                    saveCurrentConversation();
                    renderConversationList();
                    return '已中断';
                } else {
                    const errMsg = `❌ ${err.message || '请求失败'}`;
                    const m = messages.find(mm => mm.id === msgId);
                    if (m) { m.content = errMsg;
                        m.error = true;
                        m.streaming = false; }
                    finishStreamingMessage(msgId, errMsg, true, false);
                    saveCurrentConversation();
                    renderConversationList();
                    return errMsg;
                }
            } finally {
                const idx = activeControllers.indexOf(controller);
                if (idx !== -1) activeControllers.splice(idx, 1);
                streamingMsgIds.delete(msgId);
            }
        }

        async function runDebateRound(roundName, userText, agents, history, onComplete, attachments) {
            const promises = agents.map(async (agent) => {
                const msgId = genId();
                const msg = { id: msgId, role: 'agent', agentId: agent.id, content: '', timestamp: Date.now(),
                    streaming: true };
                messages.push(msg);
                addMessageElement(msg, true);
                saveCurrentConversation();
                scrollToBottomIfNeeded();
                try {
                    const content = await callAgentStreamForDebate(agent, roundName, userText, history, msgId,
                    attachments);
                    if (content !== '已中断') {
                        const m = messages.find(mm => mm.id === msgId);
                        if (m) m.content = content;
                        finishStreamingMessage(msgId, content, false, false);
                    }
                    if (onComplete) onComplete(agent, content);
                    return content;
                } catch (err) {}
            });
            await Promise.allSettled(promises);
            await new Promise(r => setTimeout(r, 200));
        }

        async function startDebate() {
            const text = inputBox.value.trim();
            if (!text && uploadedFiles.length === 0) { showToast('请输入话题或上传文件'); return; }
            if (isStreaming || isDebating) return;
            const targets = getTargetAgents();
            if (targets.length < 2) { showToast('至少需要 2 个启用的 AI 才能开始讨论'); return; }

            // 校验（✅ 修复：model 从 agent.model 取）
            for (const agent of targets) {
                const cfg = getAgentConfig(agent.id);
                if (!cfg || !cfg.apiKey) { showToast(`⚠️ "${agent.name}" 缺少API配置`); return; }
                if (!agent.model || agent.model.trim() === '') {
                    showToast(`⚠️ "${agent.name}" 未选择模型，请前往AI角色配置绑定模型`);
                    return;
                }
            }

            isDebating = true;
            isStreaming = true;
            debateBtn.disabled = true;
            setInputEnabled(false);
            sendBtn.disabled = false;
            inputBox.value = '';
            inputBox.style.height = 'auto';

            let userContent = text || '';
            const attachmentsCopy = uploadedFiles.slice();
            for (const item of attachmentsCopy) {
                const file = item.file;
                if (item.isText && item.content) userContent += `\n\n[附件: ${file.name}]\n${item.content}`;
                else if (item.isImage) userContent += `\n\n[图片: ${file.name}]`;
                else userContent += `\n\n[文件: ${file.name}]`;
            }
            const userMsg = { id: genId(), role: 'user', content: userContent, timestamp: Date.now() };
            messages.push(userMsg);
            addMessageElement(userMsg, false);
            saveCurrentConversation();
            scrollToBottomIfNeeded();
            clearAllAttachments();

            let debateHistory = [];
            addDivider('📌 阶段一：各 AI 发表初步看法');
            await runDebateRound('初步看法', text, targets, debateHistory, (agent, content) => {
                if (content !== '已中断') debateHistory.push({ round: 'opinion', agentId: agent.id, name: agent.name,
                    content });
            }, attachmentsCopy);
            if (streamingMsgIds.size > 0 || activeControllers.length > 0) {
                isDebating = false;
                isStreaming = false;
                debateBtn.disabled = false;
                setInputEnabled(true);
                sendBtn.disabled = false;
                showToast('⏹ 讨论已中断');
                saveCurrentConversation();
                renderConversationList();
                return;
            }
            addDivider('🔍 阶段二：相互评价与补充');
            await runDebateRound('相互评价', text, targets, debateHistory, (agent, content) => {
                if (content !== '已中断') debateHistory.push({ round: 'review', agentId: agent.id, name: agent.name,
                    content });
            }, attachmentsCopy);
            if (streamingMsgIds.size > 0 || activeControllers.length > 0) {
                isDebating = false;
                isStreaming = false;
                debateBtn.disabled = false;
                setInputEnabled(true);
                sendBtn.disabled = false;
                showToast('⏹ 讨论已中断');
                saveCurrentConversation();
                renderConversationList();
                return;
            }
            addDivider('⚡ 阶段三：自由辩论 · 第一轮');
            await runDebateRound('自由辩论第一轮', text, targets, debateHistory, (agent, content) => {
                if (content !== '已中断') debateHistory.push({ round: 'debate1', agentId: agent.id, name: agent.name,
                    content });
            }, attachmentsCopy);
            if (streamingMsgIds.size > 0 || activeControllers.length > 0) {
                isDebating = false;
                isStreaming = false;
                debateBtn.disabled = false;
                setInputEnabled(true);
                sendBtn.disabled = false;
                showToast('⏹ 讨论已中断');
                saveCurrentConversation();
                renderConversationList();
                return;
            }
            addDivider('⚡ 阶段四：自由辩论 · 第二轮（最终轮）');
            await runDebateRound('自由辩论第二轮', text, targets, debateHistory, (agent, content) => {
                if (content !== '已中断') debateHistory.push({ round: 'debate2', agentId: agent.id, name: agent.name,
                    content });
            }, attachmentsCopy);
            isDebating = false;
            isStreaming = false;
            debateBtn.disabled = false;
            setInputEnabled(true);
            sendBtn.disabled = false;
            inputBox.focus();
            saveCurrentConversation();
            renderConversationList();
            showToast('✅ 讨论结束');
        }

                const isMasked = keyInput.style.webkitTextSecurity === 'disc';
                keyInput.style.webkitTextSecurity = isMasked ? 'none' : 'disc';

            document.getElementById('apiFetchModels').addEventListener('click', async function() {
                const base = document.getElementById('apiEditBase').value.trim();

                if (!key) { showToast('请先填写 API Key'); return; }
                const status = document.getElementById('apiEditModelStatus');
                status.textContent = '⏳ 正在获取模型...';
                status.style.color = 'var(--text-muted)';
                try {
                    const url = `${base.replace(/\/+$/, '')}/models`;
                    const response = await fetch(url, { headers: { 'Authorization': `Bearer ${key}` } });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    let models = [];
                    if (data.data && Array.isArray(data.data)) models = data.data.map(m => m.id || m).filter(Boolean);
                    else if (Array.isArray(data)) models = data.map(m => m.id || m).filter(Boolean);
                    else throw new Error('无法解析模型列表');
                    if (models.length === 0) throw new Error('未获取到模型');
                    window._apiEditFetchedModels = models;
                    renderApiEditModelCheckboxes(currentModels);
                    status.textContent = `✅ 已获取 ${models.length} 个模型`;
                    status.style.color = 'var(--success)';
                    showToast(`✅ 已获取 ${models.length} 个模型`);

            const container = document.getElementById('apiEditModelSelect');
            const fetched = window._apiEditFetchedModels || [];
            const allModels = Array.from(new Set([...fetched, ...selected]));
            if (allModels.length === 0) {
                container.innerHTML = `<div style="color:var(--text-muted); font-size:13px;">请先点击「获取模型」拉取列表，或手动添加</div>`;
                return;
            }
            let html = '';
            for (const m of allModels) {
                const checked = selected.includes(m) ? 'checked' : '';
                html += `
                    <label class="model-option ${checked ? 'selected' : ''}">
                        <input type="checkbox" value="${escapeHtml(m)}" ${checked} />
                        <span>${escapeHtml(m)}</span>
                    </label>
                `;
            }
            container.innerHTML = html;
            container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', function() {
                    const val = this.value;
                    if (this.checked) {
                        if (!selected.includes(val)) selected.push(val);
                    } else {
                        const idx = selected.indexOf(val);
                        if (idx !== -1) selected.splice(idx, 1);
                    }
                    this.closest('.model-option').classList.toggle('selected', this.checked);
                    updateApiModelStatus();
                });
            });
            updateApiModelStatus();
        }

        let currentFolderFilter = null;

        function renderKnowledgeUI() {
            renderFolderTree();
            renderDocList();

        function renderFolderTree() {
            const rootFolders = folders.filter(f => !f.parentId);
            let html = '';
            if (rootFolders.length === 0 && folders.length === 0) {
                html = `<div class="folder-item" style="color:var(--text-muted); font-size:13px;">暂无文件夹</div>`;
            } else {
                function renderTree(folderId, depth) {
                    const children = folders.filter(f => f.parentId === folderId);
                    if (children.length === 0) return '';
                    let treeHtml = '';
                    for (const f of children) {
                        const count = knowledge.filter(k => k.folderId === f.id).length;
                        const selected = currentFolderFilter === f.id ? 'selected' : '';
                        treeHtml += `
                            <div class="folder-item ${selected}" style="padding-left:${depth * 16 + 8}px;" data-id="${f.id}">
                                <span class="folder-icon">📁</span>
                                <span class="folder-name">${escapeHtml(f.name)}</span>
                                <span class="folder-count">(${count})</span>
                                <div class="folder-actions">
                                    <button class="folder-select" data-id="${f.id}" title="筛选">🔍</button>
                                    <button class="folder-rename" data-id="${f.id}" title="重命名">✎</button>
                                    <button class="folder-delete danger" data-id="${f.id}" title="删除">✕</button>
                                </div>
                            </div>
                        `;
                        treeHtml += renderTree(f.id, depth + 1);
                    }
                    return treeHtml;
                }
                html = renderTree(null, 0);
            }
            folderTree.innerHTML = html;
            folderTree.querySelectorAll('.folder-select').forEach(btn => {
                btn.addEventListener('click', (e) => { e.stopPropagation();
                    currentFolderFilter = btn.dataset.id;
                    renderKnowledgeUI(); });
            });
            folderTree.querySelectorAll('.folder-rename').forEach(btn => {
                btn.addEventListener('click', (e) => { e.stopPropagation();
                    const id = btn.dataset.id;
                    const folder = folders.find(f => f.id === id);
                    if (!folder) return;
                    const newName = prompt('输入新文件夹名称：', folder.name);
                    if (newName && newName.trim()) { folder.name = newName.trim();
                        saveFolders();
                        renderKnowledgeUI();
                        showToast('✅ 已重命名'); }
                });
            });
            folderTree.querySelectorAll('.folder-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    if (confirm('确定删除此文件夹及其所有子文件夹吗？（文档不会被删除，仅解除关联）')) {
                        const toDelete = [id];
                        function findChildren(parentId) {
                            const kids = folders.filter(f => f.parentId === parentId);
                            for (const k of kids) { toDelete.push(k.id);
                                findChildren(k.id); }
                        }
                        findChildren(id);
                        folders = folders.filter(f => !toDelete.includes(f.id));
                        for (const doc of knowledge) {
                            if (toDelete.includes(doc.folderId)) doc.folderId = null;
                        }
                        saveFolders();
                        saveKnowledge();
                        renderKnowledgeUI();
                        showToast('已删除文件夹');
                    }
                });
            });
            folderTree.querySelectorAll('.folder-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.folder-actions')) return;
                    const id = item.dataset.id;
                    if (id) { currentFolderFilter = id;
                        renderKnowledgeUI(); }
                });
            });
        }

        function renderDocList() {
            const searchText = kbSearchInput.value.toLowerCase();
            let filtered = knowledge.slice();
            if (currentFolderFilter) {
                filtered = filtered.filter(k => k.folderId === currentFolderFilter);
            }
            if (searchText) {
                filtered = filtered.filter(k => k.title.toLowerCase().includes(searchText) || (k.content && k.content
                    .toLowerCase().includes(searchText)) || (k.tags && k.tags.some(t => t.toLowerCase().includes(
                    searchText))));
            }
            if (filtered.length === 0) {
                knowledgeList.innerHTML = `<div class="config-empty">暂无文档，请上传或手动添加</div>`;
                return;
            }
            let html = '';
            for (const doc of filtered) {
                const folder = folders.find(f => f.id === doc.folderId);
                const folderName = folder ? folder.name : '未分类';
                const tagsHtml = (doc.tags && doc.tags.length > 0) ? doc.tags.map(t =>
                    `<span class="tag">#${escapeHtml(t)}</span>`).join(' ') : '';
                const previewText = doc.content ? doc.content.slice(0, 100) : (doc.fileName || '文件');
                html += `
                    <div class="kb-doc-item" data-id="${doc.id}">
                        <div class="doc-header">
                            <span class="doc-icon">${doc.type === 'file' ? '📎' : '📄'}</span>
                            <span class="doc-title">${escapeHtml(doc.title)}</span>
                            <div class="doc-actions">
                                <button class="doc-edit" data-id="${doc.id}" title="编辑">✎</button>
                            </div>
                        </div>
                        <div class="doc-meta">
                            <span>📁 ${escapeHtml(folderName)}</span>
                            ${tagsHtml}
                            <span>📅 ${new Date(doc.createdAt).toLocaleDateString('zh-CN')}</span>
                            ${doc.fileName ? `<span>📄 ${escapeHtml(doc.fileName)}</span>` : ''}
                        </div>
                        <div class="doc-preview">${escapeHtml(previewText)}${doc.content && doc.content.length > 100 ? '…' : ''}</div>
                    </div>
                `;
            }
            knowledgeList.innerHTML = html;

            knowledgeList.querySelectorAll('.doc-edit').forEach(btn => {
                btn.addEventListener('click', (e) => { e.stopPropagation();
                    openDocEditor(btn.dataset.id); });
            });

            knowledgeList.querySelectorAll('.kb-doc-item').forEach(item => {
                let pressTimer = null;
                const startPress = (e) => {
                    pressTimer = setTimeout(() => {
                        const id = item.dataset.id;
                        const doc = knowledge.find(k => k.id === id);
                        if (doc && confirm(`确定删除文档 "${doc.title}" 吗？`)) {
                            knowledge = knowledge.filter(k => k.id !== id);
                            saveKnowledge();
                            renderKnowledgeUI();
                            showToast('已删除文档');
                        }
                        pressTimer = null;
                    }, 600);
                };
                const endPress = () => {
                    if (pressTimer) { clearTimeout(pressTimer);
                        pressTimer = null; }
                };
                item.addEventListener('touchstart', startPress);
                item.addEventListener('touchend', endPress);
                item.addEventListener('touchmove', endPress);
                item.addEventListener('mousedown', startPress);
                item.addEventListener('mouseup', endPress);
                item.addEventListener('mouseleave', endPress);
                item.querySelector('.doc-edit')?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (pressTimer) { clearTimeout(pressTimer);
                        pressTimer = null; }
                });
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.doc-actions')) return;
                });
            });
        }

        function handleKnowledgeFiles(files) {
            if (!files || files.length === 0) return;
            let successCount = 0;
            let failCount = 0;
            const total = files.length;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const isText = file.type.startsWith('text/') || file.name.match(/\.(txt|md|json|csv|log|xml|html|css|js|py|java|c|cpp|h|sh|bat|ps1|rb|go|rs|swift|kt|dart)$/i);
                if (isText) {
                    const reader = new FileReader();
                    reader.onload = (function(f) {
                        return function(e) {
                            const content = e.target.result;
                            let title = f.name.replace(/\.[^/.]+$/, '');
                            if (title.length > 50) title = title.slice(0, 47) + '…';
                            knowledge.push({
                                id: 'k_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                                title: title,
                                content: content,
                                folderId: null,
                                tags: [],
                                createdAt: Date.now(),
                                type: 'text',
                                fileName: f.name,
                            });
                            successCount++;
                            if (successCount + failCount === total) {
                                saveKnowledge();
                                renderKnowledgeUI();
                                showToast(`✅ 成功导入 ${successCount} 个文件${failCount > 0 ? `，${failCount} 个跳过` : ''}`);
                            }
                        };
                    })(file);
                    reader.onerror = function() {
                        failCount++;
                        if (successCount + failCount === total) {
                            saveKnowledge();
                            renderKnowledgeUI();
                            showToast(`✅ 成功导入 ${successCount} 个文件${failCount > 0 ? `，${failCount} 个失败` : ''}`);
                        }
                    };
                    reader.readAsText(file);
                } else {
                    let title = file.name.replace(/\.[^/.]+$/, '');
                    if (title.length > 50) title = title.slice(0, 47) + '…';
                    knowledge.push({
                        id: 'k_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                        title: title,
                        content: '',
                        folderId: null,
                        tags: [],
                        createdAt: Date.now(),
                        type: 'file',
                        fileName: file.name,
                    });
                    successCount++;
                    if (successCount + failCount === total) {
                        saveKnowledge();
                        renderKnowledgeUI();
                        showToast(`✅ 已导入 ${successCount} 个文件（保留原始格式）${failCount > 0 ? `，${failCount} 个跳过` : ''}`);
                    }
                }
            }
        }

            toggleAtDropdown(); });
        document.addEventListener('click', (e) => { if (!atSelector.contains(e.target)) closeAtDropdown(); });

        fileBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) { handleFiles(e.target.files); }
            fileInput.value = '';
        });

        const inputArea = document.getElementById('inputArea');
        inputArea.addEventListener('dragover', (e) => { e.preventDefault();
            inputArea.style.borderColor = 'var(--accent)'; });
        inputArea.addEventListener('dragleave', (e) => { e.preventDefault();
            inputArea.style.borderColor = ''; });
        inputArea.addEventListener('drop', (e) => {
            e.preventDefault();
            inputArea.style.borderColor = '';
            if (e.dataTransfer.files.length > 0) { handleFiles(e.dataTransfer.files); }
        });

        exportBtn.addEventListener('click', showExportModal);
        importBtn.addEventListener('click', showImportModal);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (configCenter.classList.contains('open')) {
                    history.back();
                }
                if (modalOverlay.classList.contains('active')) closeModal();
                if (sidebar.classList.contains('open')) { sidebar.classList.remove('open');
                    sidebarOverlay.classList.remove('active'); }
                closeAtDropdown();
                if (isStreaming) stopAllStreams();
            }
        });

        loadTheme();
        loadConfigs();
        loadAgents();
        loadFolders();
        loadKnowledge();
        loadPlatforms();
        loadConversations();

        renderConversationList();
        renderAtDropdown();
        renderApiConfigList();
        renderAgentConfigList();
        renderKnowledgeUI();
        renderPlatformsList();

        if (configs.length === 0) showToast('⚠️ 请先添加API配置');
        if (agents.length === 0) showToast('⚠️ 请添加AI角色');

        if (getEnabledAgents().length > 0 && configs.some(c => c.apiKey && c.apiKey.trim() !== '')) {
            inputBox.focus();
        }

        window.addEventListener('beforeunload', () => {
            saveCurrentConversation();
            saveAgents();
            saveConfigs();
            saveFolders();
            saveKnowledge();
            savePlatforms();
        });

        console.log('🤖 AI群聊 · 群聊接力 + @勾选标记已启动');
        console.log('📂 配置:', configs.length, '个');
        console.log('👥 AI角色:', agents.length, '个');
        console.log('💬 对话:', conversations.length, '个');
        console.log('📚 知识条目:', knowledge.length, '条');
        console.log('📁 文件夹:', folders.length, '个');
        console.log('🌐 外部平台:', platforms.length, '个');

        window.toggleGroupMode = toggleGroupMode;

    })();
</script>
</body>
</html>
