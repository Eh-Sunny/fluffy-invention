<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AI 群聊 · 知识库 Pro</title>
    <style>
        :root {
            --bg-primary: #0d0d1a;
            --bg-secondary: #12121f;
            --bg-card: rgba(255,255,255,0.03);
            --bg-input: #0d0d1a;
            --bg-input-border: rgba(255,255,255,0.08);
            --bg-hover: rgba(255,255,255,0.05);
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0c0;
            --text-muted: #666688;
            --text-inverse: #0d0d1a;
            --border-color: rgba(255,255,255,0.06);
            --shadow-color: rgba(0,0,0,0.6);
            --accent: #2d7dff;
            --accent-hover: #3d8dff;
            --accent-bg: rgba(79,140,255,0.15);
            --danger: #ff6b6b;
            --danger-bg: rgba(255,60,60,0.12);
            --success: #4ade80;
            --success-bg: rgba(45,200,120,0.1);
            --toast-bg: rgba(22,22,42,0.95);
            --modal-bg: #16162a;
            --modal-border: rgba(255,255,255,0.06);
            --bubble-user: #2d7dff;
            --bubble-assistant: #1a1a2e;
            --bubble-assistant-border: rgba(255,255,255,0.06);
            --input-area-bg: rgba(13,13,26,0.92);
            --header-bg: rgba(13,13,26,0.92);
            --config-bg: #0d0d1a;
            --config-item-bg: rgba(255,255,255,0.03);
            --config-item-hover: rgba(255,255,255,0.06);
            --config-item-border: transparent;
            --folder-bg: rgba(255,255,255,0.05);
            --folder-hover: rgba(255,255,255,0.08);
        }

        [data-theme="light"] {
            --bg-primary: #f0f0f5;
            --bg-secondary: #e8e8ee;
            --bg-card: rgba(0,0,0,0.03);
            --bg-input: #ffffff;
            --bg-input-border: rgba(0,0,0,0.1);
            --bg-hover: rgba(0,0,0,0.05);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a5e;
            --text-muted: #8888aa;
            --text-inverse: #ffffff;
            --border-color: rgba(0,0,0,0.08);
            --shadow-color: rgba(0,0,0,0.2);
            --accent: #2d7dff;
            --accent-hover: #3d8dff;
            --accent-bg: rgba(45,125,255,0.1);
            --danger: #e53e3e;
            --danger-bg: rgba(229,62,62,0.08);
            --success: #2f9e5a;
            --success-bg: rgba(47,158,90,0.08);
            --toast-bg: rgba(240,240,245,0.95);
            --modal-bg: #ffffff;
            --modal-border: rgba(0,0,0,0.08);
            --bubble-user: #2d7dff;
            --bubble-assistant: #f0f0f5;
            --bubble-assistant-border: rgba(0,0,0,0.06);
            --input-area-bg: rgba(240,240,245,0.92);
            --header-bg: rgba(240,240,245,0.92);
            --config-bg: #f0f0f5;
            --config-item-bg: rgba(0,0,0,0.02);
            --config-item-hover: rgba(0,0,0,0.04);
            --config-item-border: rgba(0,0,0,0.05);
            --folder-bg: rgba(0,0,0,0.05);
            --folder-hover: rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; transition: background 0.3s, color 0.3s; }
        .phone { width: 100%; max-width: 430px; height: 100vh; max-height: 932px; background: var(--bg-primary); display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 0 60px var(--shadow-color); transition: background 0.3s; padding-top: 6px; }
        @media (min-width:431px) { .phone { border-radius: 32px; border: 1px solid var(--border-color); } }
        @media (max-width:430px) { .phone { max-height: 100vh; border-radius: 0; box-shadow: none; } }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 8px; background: var(--header-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); flex-shrink: 0; z-index: 10; min-height: 52px; transition: background 0.3s, border-color 0.3s; }
        .header-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
        .menu-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-secondary); width: 34px; height: 34px; border-radius: 50%; font-size: 17px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .menu-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .menu-btn:active { transform: scale(0.92); }
        .header .logo { font-size: 17px; font-weight: 700; background: linear-gradient(135deg,#4f8cff,#7c5cfc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .header .logo .logo-icon svg { width: 22px; height: 22px; }
        .header-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .header-actions { display: flex; align-items: center; gap: 4px; }
        .header-actions button { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-secondary); width: 34px; height: 34px; border-radius: 50%; font-size: 16px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .header-actions button:hover { background: var(--bg-hover); color: var(--text-primary); }
        .header-actions button:active { transform: scale(0.92); }
        .header-actions .new-chat-btn { background: var(--accent-bg); color: var(--accent); font-weight: 600; width: auto; padding: 0 14px; border-radius: 20px; font-size: 14px; gap: 4px; border-color: transparent; }
        .header-actions .new-chat-btn:hover { background: var(--accent); color: #fff; }
        .theme-toggle-btn { font-size: 18px; }

        .sidebar-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 99; opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
        .sidebar-overlay.active { opacity: 1; pointer-events: auto; }
        .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 300px; max-width: 80vw; background: var(--bg-secondary); z-index: 100; transform: translateX(-100%); transition: transform 0.35s cubic-bezier(0.32,0.72,0,1); display: flex; flex-direction: column; border-right: 1px solid var(--border-color); box-shadow: 4px 0 40px var(--shadow-color); }
        .sidebar.open { transform: translateX(0); }
        .sidebar-header { padding: 16px 18px 12px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
        .sidebar-header .brand { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; color: var(--text-primary); }
        .sidebar-header .brand svg { width: 26px; height: 26px; }
        .sidebar-close { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-secondary); width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .sidebar-close:hover { background: var(--bg-hover); color: var(--text-primary); }
        .sidebar-scroll { flex: 1; overflow-y: auto; padding: 0 12px 16px; display: flex; flex-direction: column; }
        .sidebar-scroll::-webkit-scrollbar { width: 3px; }
        .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        .sidebar-section-title { font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 16px 4px 8px; display: flex; align-items: center; justify-content: space-between; }
        .sidebar-section-title button { background: transparent; border: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 2px 8px; border-radius: 10px; }
        .sidebar-section-title button:hover { background: var(--accent-bg); }
        .sidebar-divider { border: none; border-top: 1px solid var(--border-color); margin: 4px 0; }

        .conv-item { padding: 10px 12px; border-radius: 12px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; margin-bottom: 2px; border: 1px solid transparent; }
        .conv-item:hover { background: var(--bg-hover); }
        .conv-item.active { background: var(--accent-bg); border-color: var(--accent); }
        .conv-item .conv-info { flex: 1; min-width: 0; }
        .conv-item .conv-title { font-size: 14px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-item .conv-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .conv-item .conv-actions { display: flex; gap: 2px; flex-shrink: 0; opacity: 0; transition: opacity 0.2s; }
        .conv-item:hover .conv-actions { opacity: 1; }
        .conv-item .conv-actions button { background: transparent; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: all 0.15s; }
        .conv-item .conv-actions button:hover { background: var(--bg-hover); color: var(--text-primary); }
        .conv-item .conv-actions .rename-btn:hover { color: var(--accent); }
        .conv-item .conv-actions .delete-btn:hover { background: var(--danger-bg); color: var(--danger); }
        .conv-empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 16px 0; line-height: 1.6; }

        .export-section { padding: 8px 4px 4px; margin-top: auto; display: flex; gap: 6px; }
        .export-section .export-btn,
        .export-section .import-btn { flex: 1; padding: 6px 0; border-radius: 10px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 4px; border: 1px solid transparent; text-align: center; }
        .export-section .export-btn { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
        .export-section .export-btn:hover { background: var(--accent); color: #fff; }
        .export-section .import-btn { background: var(--success-bg); border-color: var(--success); color: var(--success); }
        .export-section .import-btn:hover { background: var(--success); color: #fff; }
        #importFileInput { display: none; }

        .messages { flex: 1; overflow-y: auto; padding: 12px 14px 6px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .messages::-webkit-scrollbar { width: 3px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        .welcome { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px 24px 40px; color: var(--text-muted); animation: fadeUp 0.5s ease-out; }
        .welcome .icon-wrap { width: 80px; height: 80px; border-radius: 50%; background: var(--accent-bg); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .welcome .icon-wrap svg { width: 44px; height: 44px; }
        .welcome h2 { font-size: 20px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
        .welcome p { font-size: 14px; line-height: 1.6; color: var(--text-muted); max-width: 280px; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

        .message { display: flex; flex-direction: column; max-width: 92%; animation: fadeUp 0.25s ease-out; gap: 2px; }
        .message.user { align-self: flex-end; align-items: flex-end; }
        .message.agent { align-self: flex-start; align-items: flex-start; }
        .message.divider { align-self: center; max-width: 100%; margin: 6px 0 2px; }
        .msg-header { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); padding: 0 4px 2px 4px; }
        .msg-header .avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-bg); display: flex; align-items: center; justify-content: center; font-size: 13px; border: 1px solid var(--border-color); flex-shrink: 0; }
        .msg-header .name { font-weight: 500; color: var(--text-secondary); }
        .msg-header .time { font-size: 10px; color: var(--text-muted); margin-left: 2px; }
        .bubble { padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.6; word-break: break-word; position: relative; }
        .message.user .bubble { background: var(--bubble-user); color: #fff; border-bottom-right-radius: 4px; }
        .message.agent .bubble { background: var(--bubble-assistant); color: var(--text-primary); border-bottom-left-radius: 4px; border: 1px solid var(--bubble-assistant-border); }
        .message.divider .bubble { background: var(--bg-card); border: 1px dashed var(--border-color); border-radius: 20px; color: var(--text-muted); font-size: 13px; padding: 4px 16px; text-align: center; }
        .cursor-blink { display: inline-block; width: 2px; height: 1em; background: var(--text-secondary); margin-left: 2px; vertical-align: text-bottom; animation: blink 0.9s step-end infinite; }
        @keyframes blink { 0%,100%{ opacity:1; } 50%{ opacity:0; } }
        .bubble pre { background: rgba(0,0,0,0.2); padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 4px 0; font-size: 13px; font-family: "JetBrains Mono","Fira Code",monospace; border: 1px solid var(--border-color); }
        .bubble code { background: rgba(0,0,0,0.1); padding: 1px 6px; border-radius: 4px; font-size: 14px; font-family: "JetBrains Mono","Fira Code",monospace; }
        .bubble pre code { background: transparent; padding: 0; font-size: 13px; }
        .bubble p { margin-bottom: 4px; }
        .bubble p:last-child { margin-bottom: 0; }
        .error-bubble { background: var(--danger-bg) !important; border-color: var(--danger) !important; color: var(--danger) !important; }
        .interrupted-bubble { background: rgba(255,200,0,0.1) !important; border-color: rgba(255,200,0,0.2) !important; color: #ffd966 !important; }
        .silent-bubble { background: var(--bg-card) !important; border-color: var(--border-color) !important; color: var(--text-muted) !important; font-style: italic; }

        .input-area { background: var(--input-area-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border-color); flex-shrink: 0; display: flex; flex-direction: column; padding: 6px 12px 12px; transition: background 0.3s, border-color 0.3s; }
        .input-toolbar { display: flex; align-items: center; gap: 6px; padding: 2px 2px 6px 2px; flex-wrap: wrap; }
        .input-toolbar .spacer { flex: 1; }
        .at-selector { position: relative; display: inline-block; }
        .at-selector .at-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 2px 12px 2px 10px; border-radius: 16px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 4px; height: 30px; white-space: nowrap; }
        .at-selector .at-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .at-selector .at-btn .arrow { font-size: 11px; transition: transform 0.25s; }
        .at-selector .at-btn .arrow.open { transform: rotate(180deg); }
        .at-selector .at-dropdown { position: absolute; bottom: calc(100% + 6px); left: 0; min-width: 180px; background: var(--modal-bg); border-radius: 14px; border: 1px solid var(--border-color); box-shadow: 0 -8px 40px var(--shadow-color); padding: 4px 0; max-height: 200px; overflow-y: auto; z-index: 20; display: none; backdrop-filter: blur(10px); }
        .at-selector .at-dropdown.open { display: block; }
        .at-selector .at-dropdown-item { padding: 8px 14px; font-size: 14px; color: var(--text-primary); cursor: pointer; transition: background 0.15s; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border-color); user-select: none; }
        .at-selector .at-dropdown-item:last-child { border-bottom: none; }
        .at-selector .at-dropdown-item:hover { background: var(--bg-hover); }
        .at-selector .at-dropdown-item .check { margin-left: auto; opacity: 0; font-size: 16px; font-weight: 700; transition: opacity 0.15s; }
        .at-selector .at-dropdown-item .check.checked { opacity: 1; color: var(--accent); }
        .at-selector .at-dropdown-item .at-avatar { font-size: 16px; }

        .input-toolbar .group-btn { background: var(--accent-bg); border: 1px solid var(--accent); color: var(--accent); padding: 2px 14px 2px 10px; border-radius: 16px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 4px; height: 30px; white-space: nowrap; }
        .input-toolbar .group-btn:hover { background: var(--accent); color: #fff; }
        .input-toolbar .group-btn.active { background: var(--accent); color: #fff; }
        .input-toolbar .debate-btn { background: rgba(124,92,252,0.15); border: 1px solid rgba(124,92,252,0.2); color: #b8a0ff; padding: 2px 14px 2px 12px; border-radius: 16px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 4px; height: 30px; white-space: nowrap; }
        .input-toolbar .debate-btn:hover { background: rgba(124,92,252,0.25); color: #fff; }
        .input-toolbar .debate-btn:active { transform: scale(0.95); }
        .input-toolbar .debate-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .input-toolbar .file-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-secondary); width: 30px; height: 30px; border-radius: 50%; font-size: 15px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .input-toolbar .file-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .input-toolbar .file-btn:active { transform: scale(0.92); }
        #fileInput { display: none; }

        .file-tip { background: var(--modal-bg); backdrop-filter: blur(8px); border: 1px solid var(--border-color); border-radius: 12px; padding: 6px 8px; margin: 4px 0 4px 0; display: none; flex-wrap: wrap; gap: 6px; max-height: 80px; overflow-y: auto; flex-shrink: 0; }
        .file-tip.show { display: flex; }
        .file-tip .file-item { display: flex; align-items: center; gap: 6px; background: var(--bg-card); border-radius: 8px; padding: 4px 8px 4px 6px; border: 1px solid var(--border-color); }
        .file-tip .file-item .preview { display: flex; align-items: center; gap: 4px; }
        .file-tip .file-item .preview img { max-height: 28px; max-width: 28px; border-radius: 4px; object-fit: cover; }
        .file-tip .file-item .preview .file-icon { font-size: 18px; }
        .file-tip .file-item .file-name { font-size: 12px; color: var(--text-secondary); max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-tip .file-item .remove-attachment { background: transparent; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: all 0.15s; }
        .file-tip .file-item .remove-attachment:hover { background: var(--bg-hover); color: var(--danger); }

        .input-area .input-wrap { flex: 1; background: var(--bg-input); border-radius: 22px; padding: 2px 10px 2px 14px; border: 1px solid var(--bg-input-border); transition: border-color 0.25s; display: flex; align-items: flex-end; gap: 4px; margin-top: 2px; }
        .input-area .input-wrap:focus-within { border-color: var(--accent); }
        .input-area textarea { flex: 1; background: transparent; border: none; outline: none; color: var(--text-primary); font-size: 15px; font-family: inherit; resize: none; padding: 8px 0; min-height: 22px; max-height: 100px; line-height: 1.5; }
        .input-area textarea::placeholder { color: var(--text-muted); }
        .input-area .send-btn { background: var(--accent); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; transition: all 0.2s; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .input-area .send-btn:hover { background: var(--accent-hover); transform: scale(1.02); }
        .input-area .send-btn:active { transform: scale(0.92); }
        .input-area .send-btn:disabled { background: var(--bg-card); color: var(--text-muted); cursor: not-allowed; transform: none; }
        .input-area .send-btn.stop-btn { background: var(--danger); }
        .input-area .send-btn.stop-btn:hover { background: var(--danger); }

        .config-center { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--config-bg); z-index: 500; display: none; flex-direction: column; transition: background 0.3s; }
        .config-center.open { display: flex; }
        .config-center .config-header { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border-color); background: var(--header-bg); backdrop-filter: blur(12px); flex-shrink: 0; }
        .config-center .config-header .back-btn { background: transparent; border: none; color: var(--text-secondary); font-size: 24px; cursor: pointer; padding: 4px 8px; transition: all 0.2s; }
        .config-center .config-header .back-btn:hover { color: var(--text-primary); }
        .config-center .config-header .title { font-size: 15px; font-weight: 600; margin-left: 8px; color: var(--text-primary); flex: 1; }
        .config-center .config-body { flex: 1; overflow-y: auto; padding: 12px 16px 20px; }

        .config-menu-item { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px; margin-bottom: 2px; background: var(--config-item-bg); border-radius: 12px; cursor: pointer; transition: all 0.2s; border: 1px solid var(--config-item-border); width: 100%; }
        .config-menu-item:hover { background: var(--config-item-hover); border-color: var(--border-color); }
        .config-menu-item .left { display: flex; align-items: center; gap: 12px; }
        .config-menu-item .left .icon { font-size: 22px; width: 36px; text-align: center; }
        .config-menu-item .left .label { font-size: 16px; font-weight: 500; color: var(--text-primary); }
        .config-menu-item .left .desc { font-size: 12px; color: var(--text-muted); }
        .config-menu-item .arrow { color: var(--text-muted); font-size: 18px; }

        .config-subpage .sub-header { display: none; }
        .config-subpage { display: none; flex-direction: column; height: 100%; }
        .config-subpage.active { display: flex; }
        .config-subpage .sub-body { flex: 1; overflow-y: auto; padding: 12px 0 20px; }

        .config-list-item { background: var(--config-item-bg); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; transition: all 0.2s; }
        .config-list-item:hover { background: var(--config-item-hover); border-color: var(--accent); }
        .config-list-item .info { flex: 1; min-width: 0; }
        .config-list-item .info .name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
        .config-list-item .info .detail { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .config-list-item .actions { display: flex; gap: 4px; flex-shrink: 0; }
        .config-list-item .actions button { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted); width: 30px; height: 30px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
        .config-list-item .actions button:hover { background: var(--bg-hover); color: var(--text-primary); }
        .config-list-item .actions button.danger:hover { background: var(--danger-bg); color: var(--danger); }

        .btn-primary { background: var(--accent); border: none; color: #fff; padding: 10px 0; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; width: 100%; }
        .btn-primary:hover { background: var(--accent-hover); transform: scale(1.02); }
        .btn-primary:active { transform: scale(0.96); }
        .btn-secondary { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 10px 0; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.2s; width: 100%; }
        .btn-secondary:hover { background: var(--bg-hover); color: var(--text-primary); }
        .btn-danger { background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger); padding: 10px 0; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.2s; width: 100%; }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .btn-row { display: flex; gap: 10px; margin-top: 8px; }
        .btn-row .btn-primary, .btn-row .btn-secondary, .btn-row .btn-danger { flex: 1; padding: 10px 0; }

        .config-empty { text-align: center; color: var(--text-muted); padding: 30px 0; font-size: 14px; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 20px; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-window { background: var(--modal-bg); border-radius: 24px; padding: 20px 18px 18px; max-width: 420px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; border: 1px solid var(--modal-border); box-shadow: 0 24px 80px var(--shadow-color); transform: scale(0.95) translateY(10px); transition: transform 0.3s ease; overflow-y: auto; }
        .modal-overlay.active .modal-window { transform: scale(1) translateY(0); }
        .modal-window .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 12px; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
        .modal-window .modal-close { background: transparent; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; margin-left: auto; padding: 0 4px; }
        .modal-window .modal-close:hover { color: var(--text-primary); }
        .modal-window .modal-body { flex: 1; overflow-y: auto; padding: 4px 0; }
        .modal-window .modal-footer { display: flex; gap: 10px; margin-top: 16px; }
        .modal-window .modal-footer button { flex: 1; padding: 10px 0; border-radius: 12px; border: none; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .modal-window .modal-footer .btn-save { background: var(--accent); color: #fff; }
        .modal-window .modal-footer .btn-save:hover { background: var(--accent-hover); }
        .modal-window .modal-footer .btn-cancel { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-color); }
        .modal-window .modal-footer .btn-cancel:hover { background: var(--bg-hover); color: var(--text-primary); }
        .modal-window .modal-footer .btn-delete { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
        .modal-window .modal-footer .btn-delete:hover { background: var(--danger); color: #fff; }
        .modal-window .config-form-group { margin-bottom: 14px; }
        .modal-window .config-form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
        .modal-window .config-form-group input, 
        .modal-window .config-form-group select, 
        .modal-window .config-form-group textarea { width: 100%; padding: 8px 12px; background: var(--bg-input); border: 1px solid var(--bg-input-border); border-radius: 10px; color: var(--text-primary); font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.25s; }
        .modal-window .config-form-group input:focus, 
        .modal-window .config-form-group select:focus, 
        .modal-window .config-form-group textarea:focus { border-color: var(--accent); }
        .modal-window .config-form-group .model-multi-select { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; }
        .modal-window .config-form-group .model-multi-select .model-option { display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border-color); cursor: pointer; transition: all 0.15s; font-size: 13px; }
        .modal-window .config-form-group .model-multi-select .model-option:hover { background: var(--bg-hover); }
        .modal-window .config-form-group .model-multi-select .model-option.selected { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
        .modal-window .config-form-group .model-multi-select .model-option input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
        .modal-window .config-form-group .model-multi-select .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
        .modal-window .config-form-group .model-multi-select .btn-group .select-all-btn { padding: 6px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
        .modal-window .config-form-group .model-multi-select .btn-group .select-all-btn:hover { background: var(--accent); color: #fff; }
        .modal-window .config-form-group .model-multi-select .btn-group .select-all-btn.danger { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
        .modal-window .config-form-group .model-multi-select .btn-group .select-all-btn.danger:hover { background: var(--danger); color: #fff; }
        .modal-window .config-form-group .model-multi-select .btn-group .select-all-btn.accent { background: var(--success-bg); border-color: var(--success); color: var(--success); }
        .modal-window .config-form-group .model-multi-select .btn-group .select-all-btn.accent:hover { background: var(--success); color: #fff; }
        .modal-window .config-form-group .model-manual-add { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
        .modal-window .config-form-group .model-manual-add input { flex: 1; padding: 4px 8px; background: var(--bg-input); border: 1px solid var(--bg-input-border); border-radius: 8px; color: var(--text-primary); font-size: 13px; outline: none; }
        .modal-window .config-form-group .model-manual-add input:focus { border-color: var(--accent); }
        .modal-window .config-form-group .model-manual-add button { padding: 4px 14px; background: var(--accent-bg); border: 1px solid var(--accent); border-radius: 8px; color: var(--accent); cursor: pointer; font-size: 13px; }
        .modal-window .config-form-group .model-manual-add button:hover { background: var(--accent); color: #fff; }

        .modal-window .config-form-group .api-key-row { display: flex; gap: 8px; align-items: center; }
        .modal-window .config-form-group .api-key-row input { flex: 1; }
        .modal-window .config-form-group .api-key-row .toggle-key-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; white-space: nowrap; }
        .modal-window .config-form-group .api-key-row .toggle-key-btn:hover { background: var(--bg-hover); color: var(--text-primary); }

        .export-select-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border-color); }
        .export-select-item input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; cursor: pointer; }
        .export-select-item label { cursor: pointer; flex: 1; }
        .export-select-item .badge { font-size: 12px; color: var(--text-muted); margin-left: 8px; }

        .kb-search { display: flex; gap: 8px; margin-bottom: 10px; }
        .kb-search input { flex: 1; padding: 6px 12px; background: var(--bg-input); border: 1px solid var(--bg-input-border); border-radius: 10px; color: var(--text-primary); font-size: 14px; outline: none; }
        .kb-search input:focus { border-color: var(--accent); }
        .kb-search button { background: var(--accent); border: none; color: #fff; padding: 6px 14px; border-radius: 10px; cursor: pointer; }

        .kb-toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .kb-toolbar .btn-primary, .kb-toolbar .btn-secondary { flex: 1; margin-top: 0; }

        .kb-folder-tree { background: var(--bg-card); border-radius: 12px; padding: 8px; margin-bottom: 12px; border: 1px solid var(--border-color); max-height: 150px; overflow-y: auto; }
        .kb-folder-tree .folder-item { padding: 6px 10px; display: flex; align-items: center; gap: 6px; cursor: pointer; border-radius: 6px; transition: 0.15s; }
        .kb-folder-tree .folder-item:hover { background: var(--bg-hover); }
        .kb-folder-tree .folder-item .folder-icon { font-size: 16px; }
        .kb-folder-tree .folder-item .folder-name { flex: 1; font-size: 13px; color: var(--text-primary); }
        .kb-folder-tree .folder-item .folder-count { font-size: 11px; color: var(--text-muted); }
        .kb-folder-tree .folder-item .folder-actions { display: flex; gap: 4px; }
        .kb-folder-tree .folder-item .folder-actions button { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 4px; }
        .kb-folder-tree .folder-item .folder-actions button:hover { background: var(--bg-hover); color: var(--text-primary); }
        .kb-folder-tree .folder-item .folder-actions button.danger:hover { background: var(--danger-bg); color: var(--danger); }
        .kb-folder-tree .folder-item.selected { background: var(--accent-bg); border-left: 3px solid var(--accent); }

        .kb-doc-item { background: var(--bg-card); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--border-color); position: relative; transition: background 0.15s; }
        .kb-doc-item.long-press { background: var(--accent-bg); border-color: var(--accent); }
        .kb-doc-item .doc-header { display: flex; align-items: center; gap: 8px; }
        .kb-doc-item .doc-header .doc-icon { font-size: 20px; }
        .kb-doc-item .doc-header .doc-title { font-weight: 500; color: var(--text-primary); flex: 1; }
        .kb-doc-item .doc-header .doc-actions { display: flex; gap: 4px; }
        .kb-doc-item .doc-header .doc-actions button { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; }
        .kb-doc-item .doc-header .doc-actions button:hover { background: var(--bg-hover); color: var(--text-primary); }
        .kb-doc-item .doc-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
        .kb-doc-item .doc-meta .tag { background: var(--accent-bg); color: var(--accent); padding: 0 8px; border-radius: 10px; font-size: 11px; }
        .kb-doc-item .doc-preview { font-size: 13px; color: var(--text-secondary); margin-top: 6px; max-height: 40px; overflow: hidden; text-overflow: ellipsis; }

        .toast-tip { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--toast-bg); color: var(--text-primary); padding: 10px 20px; border-radius: 12px; font-size: 13px; backdrop-filter: blur(10px); border: 1px solid var(--border-color); z-index: 9999; box-shadow: 0 8px 40px var(--shadow-color); max-width: 90%; text-align: center; animation: fadeUp 0.25s ease-out; }

        @media (max-width:430px) {
            .sidebar { max-width: 85vw; }
            .header .logo { font-size: 15px; }
            .header .logo .logo-icon svg { width: 20px; height: 20px; }
            .at-selector .at-btn, .input-toolbar .group-btn, .input-toolbar .debate-btn { font-size: 12px; padding: 1px 10px; height: 28px; }
            .input-area textarea { font-size: 14px; }
            .bubble { font-size: 14px; padding: 8px 12px; }
            .msg-header { font-size: 11px; }
            .msg-header .avatar { width: 20px; height: 20px; font-size: 11px; }
            .welcome .icon-wrap { width: 64px; height: 64px; }
            .welcome .icon-wrap svg { width: 36px; height: 36px; }
            .welcome h2 { font-size: 18px; }
            .header-actions .new-chat-btn { font-size: 12px; padding: 0 10px; height: 30px; }
            .file-tip .file-item .file-name { max-width: 60px; }
            .config-menu-item { padding: 14px 12px; }
            .config-menu-item .left .icon { font-size: 20px; width: 30px; }
            .config-menu-item .left .label { font-size: 15px; }
            .export-section .export-btn, .export-section .import-btn { font-size: 11px; padding: 5px 0; }
            .modal-window { padding: 16px; }
            .modal-window .config-form-group .model-multi-select .btn-group .select-all-btn { padding: 4px 12px; font-size: 12px; }
            .kb-toolbar .btn-primary, .kb-toolbar .btn-secondary { font-size: 13px; padding: 8px 0; }
        }
        @media (min-width:431px) { .at-selector .at-dropdown { min-width: 200px; } }
    </style>
</head>
<body>

<div class="phone" id="app">
    <header class="header">
        <div class="header-left">
            <button class="menu-btn" id="menuBtn" aria-label="菜单">☰</button>
            <span class="logo"><span class="logo-icon"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="url(#logoGrad)"/><path d="M9 20.5C9 16.5 12 14 16 14C20 14 23 16.5 23 20.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/><circle cx="13" cy="11" r="1.8" fill="white"/><circle cx="19" cy="11" r="1.8" fill="white"/><path d="M16 9V7M16 9V11M16 9H14M16 9H18" stroke="white" stroke-width="1.6" stroke-linecap="round"/><defs><linearGradient id="logoGrad" x1="0" y1="0" x2="32" y2="32"><stop offset="0%" stop-color="#4F8CFF"/><stop offset="100%" stop-color="#7C5CFC"/></linearGradient></defs></svg></span>AI 群聊</span>
        </div>
        <div class="header-right">
            <div class="header-actions">
                <button class="theme-toggle-btn" id="themeToggleBtn" title="切换主题">🌓</button>
                <button class="new-chat-btn" id="newChatBtn">＋ 新建</button>
                <button id="settingsBtn" title="配置中心">⚙</button>
            </div>
        </div>
    </header>

    <div class="messages" id="messages">
        <div class="welcome" id="welcome">
            <div class="icon-wrap"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="url(#welcomeGrad)"/><path d="M18 42C18 32 24 28 32 28C40 28 46 32 46 42" stroke="white" stroke-width="3" stroke-linecap="round"/><circle cx="26" cy="22" r="3.5" fill="white"/><circle cx="38" cy="22" r="3.5" fill="white"/><path d="M32 17V13M32 17V21M32 17H28M32 17H36" stroke="white" stroke-width="3" stroke-linecap="round"/><defs><linearGradient id="welcomeGrad" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#4F8CFF"/><stop offset="100%" stop-color="#7C5CFC"/></linearGradient></defs></svg></div>
            <h2>🤖 群聊 · 知识库 Pro</h2>
            <p>群聊模式：随机顺序，接力发言</p>
        </div>
    </div>

    <div class="input-area" id="inputArea">
        <div class="input-toolbar">
            <div class="at-selector" id="atSelector">
                <button class="at-btn" id="atBtn"><span id="atLabel">@ 全部</span><span class="arrow" id="atArrow">▾</span></button>
                <div class="at-dropdown" id="atDropdown"></div>
            </div>
            <button class="group-btn" id="groupBtn">👥 群聊</button>
            <button class="debate-btn" id="debateBtn">💬 讨论</button>
            <button class="file-btn" id="fileBtn" title="上传文件">📎</button>
            <input type="file" id="fileInput" multiple />
            <div class="spacer"></div>
        </div>
        <div class="file-tip" id="fileTip"></div>
        <div class="input-wrap">
            <textarea id="inputBox" rows="1" placeholder="输入消息…" autofocus></textarea>
            <button class="send-btn" id="sendBtn" aria-label="发送">➤</button>
        </div>
    </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-header"><span class="brand">💬 对话记录</span><button class="sidebar-close" id="sidebarClose">✕</button></div>
    <div class="sidebar-scroll">
        <div class="sidebar-section-title">📂 历史对话 <button id="newChatSidebarBtn">＋ 新建</button></div>
        <div id="convList"></div>
        <div class="export-section">
            <button class="export-btn" id="exportDataBtn">📤 导出</button>
            <button class="import-btn" id="importDataBtn">📥 导入</button>
            <input type="file" id="importFileInput" accept=".json" />
        </div>
    </div>
</div>

<div class="config-center" id="configCenter">
    <div class="config-header">
        <button class="back-btn" id="configCenterBack">‹</button>
        <span class="title" id="configCenterTitle">配置中心</span>
    </div>
    <div class="config-body" id="configBody">
        <div id="configMenu">
            <div class="config-menu-item" data-page="api"><div class="left"><span class="icon">🔌</span><div><div class="label">API 配置</div><div class="desc">管理 API 连接与模型</div></div></div><span class="arrow">›</span></div>
            <div class="config-menu-item" data-page="agents"><div class="left"><span class="icon">🤖</span><div><div class="label">AI 角色配置</div><div class="desc">管理 AI 角色与绑定</div></div></div><span class="arrow">›</span></div>
            <div class="config-menu-item" data-page="knowledge"><div class="left"><span class="icon">📚</span><div><div class="label">知识库</div><div class="desc">文件夹、标签、多格式文档、外部平台</div></div></div><span class="arrow">›</span></div>
            <div class="config-menu-item" data-page="platforms"><div class="left"><span class="icon">🌐</span><div><div class="label">外部平台</div><div class="desc">对接主流知识库 API</div></div></div><span class="arrow">›</span></div>
            <div class="config-menu-item" data-page="mcp"><div class="left"><span class="icon">🧩</span><div><div class="label">MCP</div><div class="desc">模型上下文协议（即将上线）</div></div></div><span class="arrow">›</span></div>
            <div class="config-menu-item" data-page="skills"><div class="left"><span class="icon">🛠️</span><div><div class="label">Skills</div><div class="desc">技能扩展（即将上线）</div></div></div><span class="arrow">›</span></div>
            <div class="config-menu-item" data-page="plugins"><div class="left"><span class="icon">🧩</span><div><div class="label">插件</div><div class="desc">插件扩展（即将上线）</div></div></div><span class="arrow">›</span></div>
        </div>

        <div class="config-subpage" id="subpage-api">
            <div class="sub-body" id="apiConfigBody">
                <div id="apiConfigList"></div>
                <button class="btn-primary" id="apiAddBtn" style="margin-top:12px;">＋ 新增配置</button>
            </div>
        </div>

        <div class="config-subpage" id="subpage-agents">
            <div class="sub-body" id="agentConfigBody">
                <div id="agentConfigList"></div>
                <button class="btn-primary" id="agentAddBtn" style="margin-top:12px;">＋ 新增角色</button>
            </div>
        </div>

        <div class="config-subpage" id="subpage-knowledge">
            <div class="sub-body" id="knowledgeBody">
                <div class="kb-search">
                    <input id="kbSearchInput" placeholder="搜索文档内容、标题、标签…" />
                    <button id="kbSearchBtn">🔍</button>
                </div>
                <div class="kb-toolbar">
                    <button class="btn-primary" id="kbAddDocBtn">＋ 添加文档</button>
                    <button class="btn-secondary" id="kbUploadBtn">📤 上传文件</button>
                    <button class="btn-secondary" id="kbAddFolderBtn">📁 新建文件夹</button>
                </div>
                <input type="file" id="kbFileInput" multiple accept=".txt,.md,.json,.csv,.log,.pdf,.docx,.xml,.html,.css,.js,.py,.java,.c,.cpp,.h,.sh,.bat,.ps1,.rb,.go,.rs,.swift,.kt,.dart" style="display:none;" />
                <div class="kb-folder-tree" id="kbFolderTree"></div>
                <div id="kbDocList"></div>
            </div>
        </div>

        <div class="config-subpage" id="subpage-platforms">
            <div class="sub-body">
                <div style="margin-bottom:12px; color:var(--text-muted);">对接主流知识库平台，统一检索与引用</div>
                <div id="platformList"></div>
                <button class="btn-primary" id="platformAddBtn" style="margin-top:12px;">＋ 添加平台</button>
            </div>
        </div>

        <div class="config-subpage" id="subpage-mcp"><div class="sub-body"><div class="config-empty">🧩 MCP 功能即将上线</div></div></div>
        <div class="config-subpage" id="subpage-skills"><div class="sub-body"><div class="config-empty">🛠️ Skills 功能即将上线</div></div></div>
        <div class="config-subpage" id="subpage-plugins"><div class="sub-body"><div class="config-empty">🧩 插件功能即将上线</div></div></div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-window" id="modalWindow">
        <div class="modal-title"><span id="modalTitle">编辑</span><button class="modal-close" id="modalCloseBtn">✕</button></div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter">
            <button class="btn-cancel" id="modalCancel">取消</button>
            <button class="btn-save" id="modalSave">保存</button>
            <button class="btn-delete" id="modalDelete" style="display:none;">删除</button>
        </div>
    </div>
</div>

<script>
    // ================================================================
    //  群聊模式：随机排序 + 顺序接力发言；@ 菜单勾选标记
    //  修复：
    //    1) 配置中心返回键（history 状态与 UI 渲染解耦）
    //    2) 模型校验误报（model 从 agent.model 取，而非 cfg.model）
    // ================================================================

    (function() {
        'use strict';

        const messagesEl = document.getElementById('messages');
        const inputBox = document.getElementById('inputBox');
        const sendBtn = document.getElementById('sendBtn');
        const debateBtn = document.getElementById('debateBtn');
        const groupBtn = document.getElementById('groupBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const welcomeEl = document.getElementById('welcome');
        const newChatBtn = document.getElementById('newChatBtn');
        const newChatSidebarBtn = document.getElementById('newChatSidebarBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const sidebarClose = document.getElementById('sidebarClose');
        const menuBtn = document.getElementById('menuBtn');
        const convListEl = document.getElementById('convList');
        const atSelector = document.getElementById('atSelector');
        const atBtn = document.getElementById('atBtn');
        const atLabel = document.getElementById('atLabel');
        const atArrow = document.getElementById('atArrow');
        const atDropdown = document.getElementById('atDropdown');
        const fileBtn = document.getElementById('fileBtn');
        const fileInput = document.getElementById('fileInput');
        const exportBtn = document.getElementById('exportDataBtn');
        const importBtn = document.getElementById('importDataBtn');
        const importFileInput = document.getElementById('importFileInput');
        const fileTip = document.getElementById('fileTip');

        const configCenter = document.getElementById('configCenter');
        const configCenterBack = document.getElementById('configCenterBack');
        const configCenterTitle = document.getElementById('configCenterTitle');
        const configMenu = document.getElementById('configMenu');
        const configBody = document.getElementById('configBody');

        const apiConfigList = document.getElementById('apiConfigList');
        const agentConfigList = document.getElementById('agentConfigList');
        const knowledgeList = document.getElementById('kbDocList');
        const folderTree = document.getElementById('kbFolderTree');
        const kbSearchInput = document.getElementById('kbSearchInput');
        const kbSearchBtn = document.getElementById('kbSearchBtn');
        const kbAddDocBtn = document.getElementById('kbAddDocBtn');
        const kbUploadBtn = document.getElementById('kbUploadBtn');
        const kbFileInput = document.getElementById('kbFileInput');
        const kbAddFolderBtn = document.getElementById('kbAddFolderBtn');
        const apiAddBtn = document.getElementById('apiAddBtn');
        const agentAddBtn = document.getElementById('agentAddBtn');

        const modalOverlay = document.getElementById('modalOverlay');
        const modalWindow = document.getElementById('modalWindow');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalFooter = document.getElementById('modalFooter');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const modalCancel = document.getElementById('modalCancel');
        const modalSave = document.getElementById('modalSave');
        const modalDelete = document.getElementById('modalDelete');

        let isStreaming = false;
        let isDebating = false;
        let groupChatMode = false;
        let atTargets = [];
        let activeControllers = [];
        let streamingMsgIds = new Set();
        let uploadedFiles = [];

        let editingId = null;
        let editingType = null;
        let modalCallback = null;

        const STORAGE = {
            CONFIGS: 'ai_group_configs',
            CURRENT_CONFIG_ID: 'ai_group_current_config_id',
            AGENTS: 'ai_group_agents',
            CONVERSATIONS: 'ai_group_conversations',
            CURRENT_CONV_ID: 'ai_group_current_conv_id',
            KNOWLEDGE: 'ai_group_knowledge_pro',
            FOLDERS: 'ai_group_folders',
            PLATFORMS: 'ai_group_platforms',
            THEME: 'ai_group_theme',
        };

        let configs = [];
        let currentConfigId = null;
        let agents = [];
        let conversations = [];
        let currentConvId = null;
        let messages = [];

        let knowledge = [];
        let folders = [];
        let platforms = [];

        function setTheme(theme) {
            if (theme === 'light') { document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem(STORAGE.THEME, 'light'); } else { document.documentElement.removeAttribute('data-theme');
                localStorage.setItem(STORAGE.THEME, 'dark'); }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'light' ? 'dark' : 'light');
        }

        function loadTheme() {
            const saved = localStorage.getItem(STORAGE.THEME);
            if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
            else document.documentElement.removeAttribute('data-theme');
        }

        function loadConfigs() {
            try { const data = localStorage.getItem(STORAGE.CONFIGS); if (data) configs = JSON.parse(data); else configs = []; } catch (
                _) { configs = []; }
            if (configs.length === 0) configs = [];
            let needSave = false;
            for (const c of configs) { if (c.maxTokens === undefined) { c.maxTokens = 4096;
                    needSave = true; } if (!c.models) { c.models = [];
                    needSave = true; } }
            if (needSave) saveConfigs();
            try { const id = localStorage.getItem(STORAGE.CURRENT_CONFIG_ID); if (id && configs.some(c => c.id === id))
                currentConfigId = id;
                else currentConfigId = configs[0]?.id || null; } catch (_) { currentConfigId = configs[0]?.id || null; }
            if (!currentConfigId && configs.length > 0) currentConfigId = configs[0].id;
        }

        function saveConfigs() {
            try { localStorage.setItem(STORAGE.CONFIGS, JSON.stringify(configs)); if (currentConfigId) localStorage.setItem(
                    STORAGE.CURRENT_CONFIG_ID, currentConfigId); } catch (_) {}
        }

        function loadAgents() {
            try { const data = localStorage.getItem(STORAGE.AGENTS); if (data) agents = JSON.parse(data); else agents = []; } catch (
                _) { agents = []; }
            if (agents.length === 0) {
                agents.push({ id: 'agent_default', name: '小智', avatar: '🤖', configId: configs[0]?.id || null, model: configs[
                        0]?.models?.[0] || '', prompt: '你是一个乐于助人的AI助手。', enabled: true });
                agents.push({ id: 'agent_creative', name: '小创', avatar: '🎨', configId: configs[0]?.id || null, model: configs[
                        0]?.models?.[0] || '', prompt: '你是一个富有创意、天马行空的AI。', enabled: true });
                saveAgents();
            }
            let needSave = false;
            for (const a of agents) {
                if (!configs.some(c => c.id === a.configId)) { a.configId = configs[0]?.id || null;
                    needSave = true; }
                const cfg = configs.find(c => c.id === a.configId);
                if (cfg && a.model && !cfg.models.includes(a.model)) { a.model = cfg.models[0] || '';
                    needSave = true; }
            }
            if (needSave) saveAgents();
        }

        function saveAgents() { try { localStorage.setItem(STORAGE.AGENTS, JSON.stringify(agents)); } catch (_) {} }

        function loadFolders() {
            try { const data = localStorage.getItem(STORAGE.FOLDERS); if (data) folders = JSON.parse(data); else folders = []; } catch (
                _) { folders = []; }
        }

        function saveFolders() { try { localStorage.setItem(STORAGE.FOLDERS, JSON.stringify(folders)); } catch (_) {} }

        function loadKnowledge() {
            try { const data = localStorage.getItem(STORAGE.KNOWLEDGE); if (data) knowledge = JSON.parse(data); else knowledge = []; } catch (
                _) { knowledge = []; }
        }

        function saveKnowledge() { try { localStorage.setItem(STORAGE.KNOWLEDGE, JSON.stringify(knowledge)); } catch (_) {} }

        function loadPlatforms() {
            try { const data = localStorage.getItem(STORAGE.PLATFORMS); if (data) platforms = JSON.parse(data); else platforms = []; } catch (
                _) { platforms = []; }
        }

        function savePlatforms() { try { localStorage.setItem(STORAGE.PLATFORMS, JSON.stringify(platforms)); } catch (_) {} }

        function loadConversations() {
            try { const data = localStorage.getItem(STORAGE.CONVERSATIONS); if (data) conversations = JSON.parse(data); else
                    conversations = []; } catch (_) { conversations = []; }
            if (conversations.length === 0) { const conv = { id: 'conv_default', title: '新对话', messages: [],
                    createdAt: Date.now(), updatedAt: Date.now() };
                conversations.push(conv);
                saveConversations(); }
            try { const id = localStorage.getItem(STORAGE.CURRENT_CONV_ID); if (id && conversations.some(c => c.id === id))
                currentConvId = id;
                else currentConvId = conversations[0]?.id || null; } catch (_) { currentConvId = conversations[0]?.id || null; }
            if (!currentConvId && conversations.length > 0) currentConvId = conversations[0].id;
            loadCurrentConvMessages();
        }

        function saveConversations() {
            try { localStorage.setItem(STORAGE.CONVERSATIONS, JSON.stringify(conversations)); if (currentConvId) localStorage
                    .setItem(STORAGE.CURRENT_CONV_ID, currentConvId); } catch (_) {}
        }

        function loadCurrentConvMessages() {
            const conv = conversations.find(c => c.id === currentConvId);
            if (conv) messages = conv.messages || [];
            else messages = [];
            renderMessages();
        }

        function getCurrentConv() { return conversations.find(c => c.id === currentConvId) || null; }

        function saveCurrentConversation() {
            const conv = getCurrentConv();
            if (!conv) return;
            conv.messages = messages.slice();
            conv.updatedAt = Date.now();
            const firstUser = messages.find(m => m.role === 'user');
            if (firstUser) { const title = firstUser.content.slice(0, 20) + (firstUser.content.length > 20 ? '…' : '');
                conv.title = title || '新对话'; } else { conv.title = '空对话'; }
            saveConversations();
        }

        function createNewConversation() {
            const conv = { id: 'conv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), title: '新对话',
                messages: [], createdAt: Date.now(), updatedAt: Date.now() };
            conversations.unshift(conv);
            currentConvId = conv.id;
            messages = [];
            saveConversations();
            renderConversationList();
            renderMessages();
            closeSidebar();
            showToast('✨ 新对话已创建');
            return conv;
        }

        function loadConversation(id) {
            if (isStreaming || isDebating) { stopAllStreams(); }
            saveCurrentConversation();
            const conv = conversations.find(c => c.id === id);
            if (!conv) return;
            currentConvId = id;
            messages = conv.messages || [];
            saveConversations();
            renderConversationList();
            renderMessages();
            closeSidebar();
            showToast(`已加载: ${conv.title}`);
        }

        function deleteConversation(id) {
            if (conversations.length <= 1) { showToast('至少保留一个对话'); return; }
            if (isStreaming || isDebating) { stopAllStreams(); }
            if (!confirm('确定删除此对话吗？')) return;
            const idx = conversations.findIndex(c => c.id === id);
            if (idx === -1) return;
            conversations.splice(idx, 1);
            if (currentConvId === id) {
                currentConvId = conversations[0]?.id || null;
                if (currentConvId) { const conv = conversations.find(c => c.id === currentConvId);
                    messages = conv ? conv.messages || [] : []; } else { messages = []; if (conversations.length === 0) { const
                            newConv = { id: 'conv_' + Date.now(), title: '新对话', messages: [], createdAt: Date.now(),
                            updatedAt: Date.now() };
                        conversations.push(newConv);
                        currentConvId = newConv.id;
                        messages = []; } }
            }
            saveConversations();
            renderConversationList();
            renderMessages();
            showToast('已删除对话');
        }

        function renameConversation(id) {
            const conv = conversations.find(c => c.id === id);
            if (!conv) return;
            const newTitle = prompt('输入新的对话标题：', conv.title);
            if (newTitle !== null && newTitle.trim() !== '') { conv.title = newTitle.trim();
                conv.updatedAt = Date.now();
                saveConversations();
                renderConversationList();
                showToast('✅ 已重命名'); }
        }

        function renderMessages() {
            const children = messagesEl.querySelectorAll('.message');
            children.forEach(el => el.remove());
            if (welcomeEl) welcomeEl.style.display = 'none';
            if (!messages || messages.length === 0) { welcomeEl.style.display = 'flex'; return; }
            for (const msg of messages) { addMessageElement(msg, false); }
            scrollToBottomIfNeeded();
        }

        function addMessageElement(msg, isStreamingMsg = false) {
            if (welcomeEl) welcomeEl.style.display = 'none';
            const div = document.createElement('div');
            let roleClass = msg.role === 'user' ? 'user' : 'agent';
            if (msg.role === 'divider') roleClass = 'divider';
            div.className = `message ${roleClass}`;
            div.dataset.id = msg.id || genId();

            if (msg.role !== 'divider') {
                const header = document.createElement('div');
                header.className = 'msg-header';
                if (msg.role === 'user') { header.innerHTML = `<span class="avatar">👤</span><span class="name">你</span>`; } else {
                    const agent = agents.find(a => a.id === msg.agentId);
                    const avatar = agent?.avatar || '🤖';
                    const name = agent?.name || 'AI';
                    header.innerHTML = `<span class="avatar">${avatar}</span><span class="name">${escapeHtml(name)}</span>`;
                }
                div.appendChild(header);
            }

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (msg.error) bubble.classList.add('error-bubble');
            if (msg.interrupted) bubble.classList.add('interrupted-bubble');
            if (msg.silent) bubble.classList.add('silent-bubble');

            if (msg.role === 'divider') { bubble.textContent = msg.content || '─── 阶段 ───'; } else { bubble.innerHTML =
                    formatContent(msg.content || ''); }
            div.appendChild(bubble);

            if (isStreamingMsg && msg.role !== 'divider') {
                const cursor = document.createElement('span');
                cursor.className = 'cursor-blink';
                bubble.appendChild(cursor);
            }

            messagesEl.appendChild(div);
            return { element: div, bubble };
        }

        function updateStreamingMessage(msgId, content) {
            const items = messagesEl.querySelectorAll('.message');
            for (const el of items) {
                if (el.dataset.id === msgId) {
                    const bubble = el.querySelector('.bubble');
                    if (bubble) {
                        const oldCursor = bubble.querySelector('.cursor-blink');
                        if (oldCursor) oldCursor.remove();
                        bubble.innerHTML = formatContent(content);
                        const cursor = document.createElement('span');
                        cursor.className = 'cursor-blink';
                        bubble.appendChild(cursor);
                        scrollToBottomIfNeeded();
                    }
                    return true;
                }
            }
            return false;
        }

        function finishStreamingMessage(msgId, content, error = false, interrupted = false) {
            const items = messagesEl.querySelectorAll('.message');
            for (const el of items) {
                if (el.dataset.id === msgId) {
                    const bubble = el.querySelector('.bubble');
                    if (bubble) {
                        const cursor = bubble.querySelector('.cursor-blink');
                        if (cursor) cursor.remove();
                        if (error) bubble.classList.add('error-bubble');
                        if (interrupted) bubble.classList.add('interrupted-bubble');
                        bubble.innerHTML = formatContent(content);
                        scrollToBottomIfNeeded();
                    }
                    return true;
                }
            }
            return false;
        }

        function addDivider(text) {
            const msg = { id: genId(), role: 'divider', content: text, timestamp: Date.now() };
            messages.push(msg);
            addMessageElement(msg, false);
            saveCurrentConversation();
            scrollToBottomIfNeeded();
        }

        function formatContent(text) {
            if (!text) return '';
            let html = escapeHtml(text);
            html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${escapeHtml(code.trim())}</code></pre>`);
            html = html.replace(/`([^`]+)`/g, (_, code) => `<code>${escapeHtml(code)}</code>`);
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        let autoScroll = true;

        function scrollToBottomIfNeeded() {
            if (autoScroll) { requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }); }
        }

        messagesEl.addEventListener('scroll', () => {
            const threshold = 50;
            const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < threshold;
            autoScroll = atBottom;
        });

        // 打乱数组（Fisher-Yates）
        function shuffleArray(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function renderConversationList() {
            if (conversations.length === 0) { convListEl.innerHTML = `<div class="conv-empty">暂无对话</div>`; return; }
            let html = '';
            for (const conv of conversations) {
                const active = conv.id === currentConvId ? 'active' : '';
                const title = conv.title || '新对话';
                const count = conv.messages ? conv.messages.length : 0;
                const time = new Date(conv.updatedAt || conv.createdAt);
                const timeStr = time.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }) + ' ' + time
                .toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                html += `
                    <div class="conv-item ${active}" data-id="${conv.id}">
                        <div class="conv-info"><div class="conv-title">${escapeHtml(title)}</div><div class="conv-meta">${timeStr} · ${count} 条</div></div>
                        <div class="conv-actions"><button class="rename-btn" data-id="${conv.id}" title="重命名">✎</button><button class="delete-btn" data-id="${conv.id}" title="删除">✕</button></div>
                    </div>
                `;
            }
            convListEl.innerHTML = html;
            convListEl.querySelectorAll('.conv-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.conv-actions')) return;
                    const id = item.dataset.id;
                    if (id !== currentConvId) loadConversation(id);
                });
                const renameBtn = item.querySelector('.rename-btn');
                if (renameBtn) {
                    renameBtn.addEventListener('click', (e) => { e.stopPropagation();
                        renameConversation(item.dataset.id); });
                }
                const delBtn = item.querySelector('.delete-btn');
                if (delBtn) {
                    delBtn.addEventListener('click', (e) => { e.stopPropagation();
                        deleteConversation(item.dataset.id); });
                }
            });
        }

        // ===== @下拉菜单：勾选标记 =====
        function renderAtDropdown() {
            const enabled = getEnabledAgents();
            const allChecked = atTargets.length === 0;
            let html = `
                <div class="at-dropdown-item ${allChecked ? 'active' : ''}" data-id="__all">
                    <span>🌐 全部</span>
                    <span class="check ${allChecked ? 'checked' : ''}">✓</span>
                </div>
            `;
            for (const agent of enabled) {
                const checked = atTargets.includes(agent.id);
                html += `
                    <div class="at-dropdown-item ${checked ? 'active' : ''}" data-id="${agent.id}">
                        <span class="at-avatar">${agent.avatar || '🤖'}</span>
                        <span>${escapeHtml(agent.name)}</span>
                        <span class="check ${checked ? 'checked' : ''}">✓</span>
                    </div>`;
            }
            atDropdown.innerHTML = html;
            if (atTargets.length === 0) atLabel.textContent = '@ 全部';
            else {
                const names = atTargets.map(id => { const a = agents.find(ag => ag.id === id); return a ? a.name : '?'; });
                if (names.length <= 2) atLabel.textContent = '@ ' + names.join(', ');
                else atLabel.textContent = '@ ' + names.slice(0, 2).join(', ') + ` +${names.length - 2}`;
            }
            atDropdown.querySelectorAll('.at-dropdown-item').forEach(item => {
                item.addEventListener('click', () => {
                    const id = item.dataset.id;
                    if (id === '__all') { atTargets = []; } else {
                        const idx = atTargets.indexOf(id);
                        if (idx !== -1) atTargets.splice(idx, 1);
                        else atTargets.push(id);
                    }
                    renderAtDropdown();
                });
            });
        }

        function toggleAtDropdown() {
            const isOpen = atDropdown.classList.toggle('open');
            atArrow.classList.toggle('open', isOpen);
            if (isOpen) renderAtDropdown();
        }

        function closeAtDropdown() {
            atDropdown.classList.remove('open');
            atArrow.classList.remove('open');
        }

        function getTargetAgents() {
            if (atTargets.length === 0) return getEnabledAgents();
            else return agents.filter(a => atTargets.includes(a.id) && a.enabled);
        }

        function getEnabledAgents() { return agents.filter(a => a.enabled); }

        function getAgentConfig(agentId) {
            const agent = agents.find(a => a.id === agentId);
            if (!agent) return null;
            return configs.find(c => c.id === agent.configId) || null;
        }

        function genId() { return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6); }

        function showToast(msg) {
            const existing = document.querySelector('.toast-tip');
            if (existing) existing.remove();
            const div = document.createElement('div');
            div.className = 'toast-tip';
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => { div.style.opacity = '0';
                div.style.transition = 'opacity 0.3s';
                setTimeout(() => div.remove(), 400); }, 2500);
        }

        function setInputEnabled(enabled) {
            inputBox.disabled = !enabled;
            if (!enabled) { sendBtn.classList.add('stop-btn');
                sendBtn.textContent = '⏹';
                sendBtn.disabled = false;
                sendBtn.title = '停止生成'; } else { sendBtn.classList.remove('stop-btn');
                sendBtn.textContent = '➤';
                sendBtn.disabled = false;
                sendBtn.title = '发送'; }
        }

        function autoResize() {
            inputBox.style.height = 'auto';
            inputBox.style.height = Math.min(inputBox.scrollHeight, 100) + 'px';
        }

        inputBox.addEventListener('focus', () => {
            setTimeout(() => {
                inputBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
                scrollToBottomIfNeeded();
            }, 300);
        });

        function toggleGroupMode() {
            groupChatMode = !groupChatMode;
            groupBtn.classList.toggle('active', groupChatMode);
            groupBtn.textContent = groupChatMode ? '👥 群聊 ON' : '👥 群聊';
            showToast(groupChatMode ? '✅ 群聊模式已开启：随机顺序，接力发言' : '❌ 群聊模式已关闭');
        }

        function showExportModal() {
            let html = `<div style="margin-bottom:12px; color:var(--text-muted);">选择要导出的内容：</div>`;
            html += `<div style="margin-bottom:8px; font-weight:500;">API 配置</div>`;
            if (configs.length === 0) html += `<div style="color:var(--text-muted); padding-left:10px;">暂无配置</div>`;
            else { for (const c of configs) { html +=
                        `<div class="export-select-item"><input type="checkbox" class="export-check" data-type="config" value="${c.id}" checked /><label>${escapeHtml(c.name)}</label></div>`; } }
            html += `<div style="margin:8px 0; font-weight:500;">AI 角色</div>`;
            if (agents.length === 0) html += `<div style="color:var(--text-muted); padding-left:10px;">暂无角色</div>`;
            else { for (const a of agents) { html +=
                        `<div class="export-select-item"><input type="checkbox" class="export-check" data-type="agent" value="${a.id}" checked /><label>${a.avatar || '🤖'} ${escapeHtml(a.name)}</label></div>`; } }
            html += `<div style="margin:8px 0; font-weight:500;">对话记录</div>`;
            if (conversations.length === 0) html += `<div style="color:var(--text-muted); padding-left:10px;">暂无对话</div>`;
            else { for (const conv of conversations) { const count = conv.messages ? conv.messages.length : 0; html +=
                        `<div class="export-select-item"><input type="checkbox" class="export-check" data-type="conversation" value="${conv.id}" checked /><label>${escapeHtml(conv.title)} <span class="badge">(${count}条)</span></label></div>`; } }
            html += `<div style="margin:8px 0; font-weight:500;">知识库</div>`;

        function doExport(selected) {

                const exportData = {
                    version: '1.0',
                    exportDate: new Date().toISOString(),
                    configs: configs.filter(c => selected.configs.includes(c.id)),
                    agents: agents.filter(a => selected.agents.includes(a.id)),

                    knowledge: knowledge.filter(k => selected.knowledge.includes(k.id)),
                    platforms: platforms.filter(p => selected.platforms.includes(p.id)),
                    folders: folders,
                    currentConfigId: currentConfigId,
                    currentConvId: currentConvId,
                };
                if (!exportData.configs.some(c => c.id === exportData.currentConfigId)) exportData.currentConfigId = null;
                if (!exportData.conversations.some(c => c.id === exportData.currentConvId)) exportData.currentConvId = null;
                const json = JSON.stringify(exportData, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `ai_chat_backup_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('✅ 数据已导出，文件已保存到您的下载目录，请查看浏览器下载栏。');

        function handleFiles(files) {
            if (!files || files.length === 0) return;
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const isText = file.type.startsWith('text/') || file.name.match(/\.(txt|md|json|js|css|html|xml|yml|yaml|log|csv|tsv|py|java|c|cpp|h|sh|bat|ps1|rb|go|rs|swift|kt|dart)$/i);
                const isImage = file.type.startsWith('image/');
                if (isText) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        uploadedFiles.push({ file, dataUrl: null, content: e.target.result, isText: true,
                            isImage: false });
                        renderAttachments();
                        showToast(`✅ 已附加文本文件: ${file.name}`);
                    };
                    reader.onerror = function() { showToast('❌ 读取文件失败'); };
                    reader.readAsText(file);
                } else if (isImage) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        uploadedFiles.push({ file, dataUrl: e.target.result, content: null, isText: false,
                            isImage: true });
                        renderAttachments();
                        showToast(`✅ 已附加图片: ${file.name}`);
                    };
                    reader.onerror = function() { showToast('❌ 读取图片失败'); };
                    reader.readAsDataURL(file);
                } else {
                    uploadedFiles.push({ file, dataUrl: null, content: null, isText: false, isImage: false });
                    renderAttachments();
                    showToast(`📎 已附加文件: ${file.name}`);
                }
            }
        }

                fileTip.innerHTML = ''; return; }

            for (let i = 0; i < uploadedFiles.length; i++) {
                const item = uploadedFiles[i];

                    `<span class="file-icon">📎</span>`;

                    <div class="file-item" data-index="${i}">

                        <button class="remove-attachment" data-index="${i}" title="移除">✕</button>
