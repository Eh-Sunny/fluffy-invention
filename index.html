                            <div class="detail">${escapeHtml(configName)} · 模型: ${escapeHtml(modelName)} · ${escapeHtml(a.prompt || '无提示词')}</div>
                        </div>
                        <div class="actions">
                            <button class="edit-btn" data-id="${a.id}" title="编辑">✎</button>
                            <button class="delete-btn" data-id="${a.id}" title="删除" style="${agents.length <= 1 ? 'opacity:0.3;pointer-events:none;' : ''}">✕</button>
                        </div>
                    </div>
                `;
            }
            agentConfigList.innerHTML = html;
            agentConfigList.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => { e.stopPropagation();
                    openAgentEditor(btn.dataset.id); });
            });
            agentConfigList.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    if (agents.length <= 1) { showToast('至少保留一个角色'); return; }
                    if (confirm(`删除角色 "${agents.find(a=>a.id===id)?.name}" 吗？`)) deleteAgentConfig(id);
                });
            });
            agentConfigList.querySelectorAll('.config-list-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.actions')) return;
                    openAgentEditor(item.dataset.id);
                });
            });
        }

        // ---------- 浮窗编辑 API ----------
        function openApiEditor(id) {
            const cfg = configs.find(c => c.id === id);
            if (!cfg && id !== 'new') return;
            const isNew = id === 'new';
            const target = isNew ? { name: '', apiBase: '', apiKey: '', models: [], maxTokens: 4096 } : cfg;

            let bodyHtml = `
                <div class="config-form-group"><label>配置名称</label><input id="apiEditName" value="${escapeHtml(target.name)}" placeholder="例如：DeepSeek" /></div>
                <div class="config-form-group"><label>API 地址</label><input id="apiEditBase" value="${escapeHtml(target.apiBase)}" placeholder="https://api.deepseek.com/v1" /></div>
                <div class="config-form-group">
                    <label>API Key</label>
                    <div class="api-key-row">
                        <input id="apiEditKey" type="text" style="-webkit-text-security: disc;" value="${escapeHtml(target.apiKey)}" placeholder="sk-..." />
                        <button class="toggle-key-btn" id="apiToggleKey">🔒</button>
                    </div>
                </div>
                <div class="config-form-group">
                    <label>模型多选</label>
                    <div class="btn-group" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px;">
                        <button id="apiFetchModels" class="select-all-btn" style="order:1;">获取模型</button>
                        <button id="apiSelectAll" class="select-all-btn accent" style="order:2;">全选</button>
                        <button id="apiDeselectAll" class="select-all-btn danger" style="order:3;">全不选</button>
                    </div>
                    <div class="model-multi-select" id="apiEditModelSelect"></div>
                    <div style="font-size:12px; color:#666688; margin-top:4px;" id="apiEditModelStatus"></div>
                </div>
                <div class="config-form-group"><label>最大输出 Token</label><input id="apiEditMaxTokens" type="number" value="${target.maxTokens || 4096}" placeholder="4096" min="1" step="1" /></div>
            `;
            modalTitle.textContent = isNew ? '新增 API 配置' : '编辑 API 配置';
            modalBody.innerHTML = bodyHtml;
            modalDelete.style.display = isNew ? 'none' : 'block';
            modalSave.textContent = '保存';
            modalCancel.textContent = '取消';

            // 初始化模型多选
            const selectedModels = target.models || [];
            window._apiEditFetchedModels = [];
            renderApiEditModelCheckboxes(selectedModels);

            // 切换Key显示：使用 -webkit-text-security 实现非安全键盘的掩码
            const keyInput = document.getElementById('apiEditKey');
            const toggleBtn = document.getElementById('apiToggleKey');
            // 初始状态为掩码（🔒）
            keyInput.style.webkitTextSecurity = 'disc';
            toggleBtn.textContent = '🔒';
            toggleBtn.addEventListener('click', function() {
                const isMasked = keyInput.style.webkitTextSecurity === 'disc';
                keyInput.style.webkitTextSecurity = isMasked ? 'none' : 'disc';
                this.textContent = isMasked ? '🔓' : '🔒';
            });

            // 获取模型按钮
            document.getElementById('apiFetchModels').addEventListener('click', async function() {
                const base = document.getElementById('apiEditBase').value.trim();
                const key = document.getElementById('apiEditKey').value.trim();
                if (!base) { showToast('请先填写 API 地址'); return; }
                if (!key) { showToast('请先填写 API Key'); return; }
                const status = document.getElementById('apiEditModelStatus');
                status.textContent = '⏳ 正在获取模型...';
                status.style.color = '#8888aa';
                try {
                    const url = `${base.replace(/\/+$/, '')}/models`;
                    const response = await fetch(url, { headers: { 'Authorization': `Bearer ${key}` } });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    let models = [];
                    if (data.data && Array.isArray(data.data)) models = data.data.map(m => m.id || m).filter(Boolean);
                    else if (Array.isArray(data)) models = data.map(m => m.id || m).filter(Boolean);
                    else throw new Error('无法解析模型列表');
                    if (models.length === 0) throw new Error('未获取到模型');
                    window._apiEditFetchedModels = models;
                    const currentSelected = getApiEditSelectedModels();
                    renderApiEditModelCheckboxes(currentSelected);
                    status.textContent = `✅ 已获取 ${models.length} 个模型`;
                    status.style.color = '#4ade80';
                    showToast(`✅ 已获取 ${models.length} 个模型`);
                } catch (err) {
                    status.textContent = `❌ 获取失败：${err.message}`;
                    status.style.color = '#ff6b6b';
                    showToast('❌ 获取模型失败');
                }
            });

            // 全选
            document.getElementById('apiSelectAll').addEventListener('click', function() {
                document.querySelectorAll('#apiEditModelSelect input[type="checkbox"]').forEach(cb => {
                    cb.checked = true;
                    cb.closest('.model-option').classList.add('selected');
                });
                updateApiModelStatus();
            });

            // 全不选
            document.getElementById('apiDeselectAll').addEventListener('click', function() {
                document.querySelectorAll('#apiEditModelSelect input[type="checkbox"]').forEach(cb => {
                    cb.checked = false;
                    cb.closest('.model-option').classList.remove('selected');
                });
                updateApiModelStatus();
            });

            modalSave.onclick = function() {
                const name = document.getElementById('apiEditName').value.trim();
                const base = document.getElementById('apiEditBase').value.trim();
                const key = document.getElementById('apiEditKey').value.trim();
                const maxTokens = parseInt(document.getElementById('apiEditMaxTokens').value) || 4096;
                const models = getApiEditSelectedModels();
                if (!name || !base || !key) { showToast('请填写完整信息'); return; }
                if (models.length === 0) { showToast('请至少选择一个模型'); return; }

                if (isNew) {
                    configs.push({
                        id: 'cfg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
                        name,
                        apiBase: base,
                        apiKey: key,
                        models,
                        maxTokens
                    });
                } else {
                    const idx = configs.findIndex(c => c.id === id);
                    if (idx !== -1) configs[idx] = { ...configs[idx], name, apiBase: base, apiKey: key, models,
                    maxTokens };
                }
                saveConfigs();
                if (!currentConfigId || !configs.some(c => c.id === currentConfigId)) {
                    currentConfigId = configs[0].id;
                    saveConfigs();
                }
                for (const a of agents) {
                    if (!a.configId || !configs.some(c => c.id === a.configId)) {
                        a.configId = currentConfigId;
                    }
                    const cfg = configs.find(c => c.id === a.configId);
                    if (cfg && a.model && !cfg.models.includes(a.model)) {
                        a.model = cfg.models[0] || '';
                    }
                }
                saveAgents();
                renderApiConfigList();
                renderAgentConfigList();
                renderAtDropdown();
                closeModal();
                showToast('✅ 配置已保存');
            };

            modalDelete.onclick = function() {
                if (configs.length <= 1) { showToast('至少保留一个配置'); return; }
                if (confirm(`确定删除配置 "${configs.find(c=>c.id===id)?.name}" 吗？`)) {
                    deleteApiConfig(id);
                    closeModal();
                }
            };

            modalCancel.onclick = closeModal;
            modalCloseBtn.onclick = closeModal;
            openModal();
        }

        function renderApiEditModelCheckboxes(selected) {
            const container = document.getElementById('apiEditModelSelect');
            const models = window._apiEditFetchedModels || [];
            if (models.length === 0) {
                container.innerHTML = `<div style="color:#666688; font-size:13px;">请先点击「获取模型」拉取列表</div>`;
                return;
            }
            let html = '';
            for (const m of models) {
                const checked = selected.includes(m) ? 'checked' : '';
                html += `
                    <label class="model-option ${checked ? 'selected' : ''}">
                        <input type="checkbox" value="${escapeHtml(m)}" ${checked} />
                        <span>${escapeHtml(m)}</span>
                    </label>
                `;
            }
            container.innerHTML = html;
            container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', function() {
                    this.closest('.model-option').classList.toggle('selected', this.checked);
                    updateApiModelStatus();
                });
            });
            updateApiModelStatus();
        }

        function getApiEditSelectedModels() {
            const cbs = document.querySelectorAll('#apiEditModelSelect input[type="checkbox"]:checked');
            return Array.from(cbs).map(cb => cb.value);
        }

        function updateApiModelStatus() {
            const cbs = document.querySelectorAll('#apiEditModelSelect input[type="checkbox"]:checked');
            const count = cbs.length;
            const status = document.getElementById('apiEditModelStatus');
            if (count > 0) status.textContent = `已选 ${count} 个模型`;
            else status.textContent = '未选择模型';
        }

        function deleteApiConfig(id) {
            if (configs.length <= 1) return;
            const idx = configs.findIndex(c => c.id === id);
            if (idx === -1) return;
            configs.splice(idx, 1);
            if (currentConfigId === id) currentConfigId = configs[0].id;
            saveConfigs();
            for (const a of agents) {
                if (!configs.some(c => c.id === a.configId)) {
                    a.configId = configs[0]?.id || null;
                }
                const cfg = configs.find(c => c.id === a.configId);
                if (cfg && a.model && !cfg.models.includes(a.model)) {
                    a.model = cfg.models[0] || '';
                }
            }
            saveAgents();
            renderApiConfigList();
            renderAgentConfigList();
            renderAtDropdown();
            showToast('已删除配置');
        }

        // ---------- 浮窗编辑 AI 角色 ----------
        function openAgentEditor(id) {
            const agent = agents.find(a => a.id === id);
            if (!agent && id !== 'new') return;
            const isNew = id === 'new';
            const target = isNew ? { name: '', avatar: '🤖', configId: configs[0]?.id || '', model: '', prompt: '',
                enabled: true } : agent;

            let configOptions = '';
            for (const c of configs) {
                const sel = c.id === target.configId ? 'selected' : '';
                configOptions += `<option value="${c.id}" ${sel}>${escapeHtml(c.name)}</option>`;
            }
            let modelOptions = '<option value="">请选择模型</option>';
            const cfg = configs.find(c => c.id === target.configId);
            if (cfg && cfg.models) {
                for (const m of cfg.models) {
                    const sel = m === target.model ? 'selected' : '';
                    modelOptions += `<option value="${escapeHtml(m)}" ${sel}>${escapeHtml(m)}</option>`;
                }
            }

            let bodyHtml = `
                <div class="config-form-group">
                    <label>头像 (Emoji)</label>
                    <input id="agentEditAvatar" value="${escapeHtml(target.avatar || '🤖')}" maxlength="2" style="width:60px; text-align:center; font-size:24px;" />
                </div>
                <div class="config-form-group"><label>角色名称</label><input id="agentEditName" value="${escapeHtml(target.name)}" placeholder="角色名称" /></div>
                <div class="config-form-group">
                    <label>绑定 API 配置</label>
                    <select id="agentEditConfig">${configOptions}</select>
                </div>
                <div class="config-form-group">
                    <label>选择模型</label>
                    <select id="agentEditModel">${modelOptions}</select>
                </div>
                <div class="config-form-group"><label>系统提示词</label><textarea id="agentEditPrompt" rows="3" placeholder="你是一个乐于助人的AI助手…">${escapeHtml(target.prompt || '')}</textarea></div>
                <div class="config-form-group">
                    <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                        <input type="checkbox" id="agentEditEnabled" ${target.enabled ? 'checked' : ''} style="width:18px; height:18px; accent-color:#4f8cff;" />
                        启用此角色
                    </label>
                </div>
            `;
            modalTitle.textContent = isNew ? '新增 AI 角色' : '编辑 AI 角色';
            modalBody.innerHTML = bodyHtml;
            modalDelete.style.display = isNew ? 'none' : 'block';
            modalSave.textContent = '保存';
            modalCancel.textContent = '取消';

            document.getElementById('agentEditConfig').addEventListener('change', function() {
                const configId = this.value;
                const cfg = configs.find(c => c.id === configId);
                const modelSelect = document.getElementById('agentEditModel');
                let html = '<option value="">请选择模型</option>';
                if (cfg && cfg.models) {
                    for (const m of cfg.models) {
                        html += `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`;
                    }
                }
                modelSelect.innerHTML = html;
            });

            modalSave.onclick = function() {
                const avatar = document.getElementById('agentEditAvatar').value.trim() || '🤖';
                const name = document.getElementById('agentEditName').value.trim();
                const configId = document.getElementById('agentEditConfig').value;
                const model = document.getElementById('agentEditModel').value;
                const prompt = document.getElementById('agentEditPrompt').value.trim();
                const enabled = document.getElementById('agentEditEnabled').checked;
                if (!name) { showToast('请输入角色名称'); return; }
                if (!configId) { showToast('请选择API配置'); return; }
                if (!model) { showToast('请选择模型'); return; }

                if (isNew) {
                    agents.push({
                        id: 'agent_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
                        avatar,
                        name,
                        configId,
                        model,
                        prompt,
                        enabled,
                    });
                } else {
                    const idx = agents.findIndex(a => a.id === id);
                    if (idx !== -1) agents[idx] = { ...agents[idx], avatar, name, configId, model, prompt, enabled };
                }
                saveAgents();
                renderAgentConfigList();
                renderAtDropdown();
                closeModal();
                showToast('✅ 角色已保存');
            };

            modalDelete.onclick = function() {
                if (agents.length <= 1) { showToast('至少保留一个角色'); return; }
                if (confirm(`确定删除角色 "${agents.find(a=>a.id===id)?.name}" 吗？`)) {
                    deleteAgentConfig(id);
                    closeModal();
                }
            };

            modalCancel.onclick = closeModal;
            modalCloseBtn.onclick = closeModal;
            openModal();
        }

        function deleteAgentConfig(id) {
            if (agents.length <= 1) return;
            const idx = agents.findIndex(a => a.id === id);
            if (idx === -1) return;
            agents.splice(idx, 1);
            saveAgents();
            renderAgentConfigList();
            renderAtDropdown();
            const tIdx = atTargets.indexOf(id);
            if (tIdx !== -1) atTargets.splice(tIdx, 1);
            showToast('已删除角色');
        }

        // ================================================================
        //  事件绑定
        // ================================================================

        sendBtn.addEventListener('click', () => {
            if (isStreaming) { stopAllStreams(); return; }
            const text = inputBox.value.trim();
            if (text || uploadedFiles.length > 0) quickReply(text);
            else showToast('请输入消息或上传文件');
        });

        inputBox.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const text = inputBox.value.trim();
                if (text || uploadedFiles.length > 0) quickReply(text);
                else showToast('请输入消息或上传文件');
            }
        });
        inputBox.addEventListener('input', autoResize);

        groupBtn.addEventListener('click', toggleGroupMode);
        debateBtn.addEventListener('click', startDebate);

        newChatBtn.addEventListener('click', createNewConversation);
        newChatSidebarBtn.addEventListener('click', createNewConversation);

        menuBtn.addEventListener('click', () => {
            sidebar.classList.add('open');
            sidebarOverlay.classList.add('active');
            renderConversationList();
        });
        sidebarClose.addEventListener('click', () => {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
        });
        sidebarOverlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
        });

        settingsBtn.addEventListener('click', openConfigCenter);

        // 配置中心返回按钮逻辑：根据当前状态决定返回上一级还是关闭
        configCenterBack.addEventListener('click', function() {
            const activeSubpage = document.querySelector('.config-subpage.active');
            if (activeSubpage) {
                // 有子页面激活，返回菜单（上一级）
                showMenu();
            } else {
                // 在菜单页，关闭配置中心
                closeConfigCenter();
            }
        });

        // 配置菜单点击
        document.querySelectorAll('.config-menu-item').forEach(item => {
            item.addEventListener('click', () => {
                const page = item.dataset.page;
                if (page) showSubpage(page);
            });
        });

        // 子页面返回（通过子页面的返回按钮，实际已移除，但保留点击事件以防万一）
        document.querySelectorAll('.sub-back').forEach(btn => {
            btn.addEventListener('click', () => {
                showMenu();
            });
        });

        // API 添加
        apiAddBtn.addEventListener('click', () => {
            openApiEditor('new');
        });

        // AI 角色添加
        agentAddBtn.addEventListener('click', () => {
            openAgentEditor('new');
        });

        // @选择器
        atBtn.addEventListener('click', (e) => { e.stopPropagation();
            toggleAtDropdown(); });
        document.addEventListener('click', (e) => { if (!atSelector.contains(e.target)) closeAtDropdown(); });

        // 文件上传
        fileBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) { handleFiles(e.target.files); }
            fileInput.value = '';
        });

        // 拖拽
        const inputArea = document.getElementById('inputArea');
        inputArea.addEventListener('dragover', (e) => { e.preventDefault();
            inputArea.style.borderColor = 'rgba(79,140,255,0.5)'; });
        inputArea.addEventListener('dragleave', (e) => { e.preventDefault();
            inputArea.style.borderColor = ''; });
        inputArea.addEventListener('drop', (e) => {
            e.preventDefault();
            inputArea.style.borderColor = '';
            if (e.dataTransfer.files.length > 0) { handleFiles(e.dataTransfer.files); }
        });

        // 导出/导入（多选）
        exportBtn.addEventListener('click', showExportModal);
        importBtn.addEventListener('click', showImportModal);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (configCenter.classList.contains('open')) {
                    const activeSubpage = document.querySelector('.config-subpage.active');
                    if (activeSubpage) {
                        showMenu(); // 返回上一级
                    } else {
                        closeConfigCenter();
                    }
                }
                if (modalOverlay.classList.contains('active')) closeModal();
                if (sidebar.classList.contains('open')) { sidebar.classList.remove('open');
                    sidebarOverlay.classList.remove('active'); }
                closeAtDropdown();
                if (isStreaming) stopAllStreams();
            }
        });

        // ---------- 初始化 ----------
        loadConfigs();
        loadAgents();
        loadConversations();

        renderConversationList();
        renderAtDropdown();
        renderApiConfigList();
        renderAgentConfigList();

        if (configs.length === 0) showToast('⚠️ 请先添加API配置');
        if (agents.length === 0) showToast('⚠️ 请添加AI角色');

        if (getEnabledAgents().length > 0 && configs.some(c => c.apiKey && c.apiKey.trim() !== '')) {
            inputBox.focus();
        }

        window.addEventListener('beforeunload', () => {
            saveCurrentConversation();
            saveAgents();
            saveConfigs();
        });

        console.log('🤖 AI群聊 · 配置中心最终优化版');
        console.log('📂 配置:', configs.length, '个');
        console.log('👥 AI角色:', agents.length, '个');
        console.log('💬 对话:', conversations.length, '个');

        window.toggleGroupMode = toggleGroupMode;

    })();
</script>
</body>
</html>
